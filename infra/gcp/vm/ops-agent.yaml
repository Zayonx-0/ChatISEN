logging:
  receivers:
    chatisen_containers:
      type: files
      include_paths: [/var/lib/docker/containers/*/*-json.log]
      wildcard_refresh_interval: 15s
  processors:
    docker:
      type: parse_json
      time_key: time
      time_format: "%Y-%m-%dT%H:%M:%S.%LZ"
    services:
      type: exclude_logs
      match_any:
        - 'NOT jsonPayload.attrs."com.docker.compose.service" =~ "^(nginx|api|cloud-sql-proxy|coturn|livekit)$"'
    # Seuls les champs ci-dessous sont conservés, y compris pour les images tierces.
    fields:
      type: parse_regex
      field: log
      regex: '^(?:(?=.*"requestId":\s*"(?<requestId>[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})")|)(?:(?=.*"method":\s*"(?<method>GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|other)")|)(?:(?=.*"status":\s*(?<status>[1-5][0-9]{2})\b)|)(?:(?=.*"elapsedMs":\s*(?<elapsedMs>[0-9]+(?:\.[0-9]+)?))|)(?:(?=.*"durationSeconds":\s*(?<durationSeconds>[0-9]+(?:\.[0-9]+)?))|)(?:(?=.*"(?:severity|level)":\s*"(?<vendorLevel>DEBUG|INFO|NOTICE|WARNING|WARN|ERROR|FATAL|debug|info|warn|error|fatal)")|)(?:(?=.*"level":\s*(?<apiLevel>10|20|30|40|50|60)\b)|)(?:(?=(?:[0-9]*:\s*)+(?<turnLevel>DEBUG|INFO|WARNING|WARN|ERROR|FATAL):)|).*'
    sanitized:
      type: modify_fields
      fields:
        jsonPayload.container:
          move_from: 'jsonPayload.attrs."com.docker.compose.service"'
        severity:
          copy_from: jsonPayload.vendorLevel
          default_value: INFO
          map_values: {DEBUG: DEBUG, INFO: INFO, NOTICE: NOTICE, WARNING: WARNING, WARN: WARNING, ERROR: ERROR, FATAL: CRITICAL, debug: DEBUG, info: INFO, warn: WARNING, error: ERROR, fatal: CRITICAL}
        jsonPayload.log:
          omit_if: 'jsonPayload.log =~ ".*"'
        jsonPayload.message:
          omit_if: 'jsonPayload.message =~ ".*"'
        jsonPayload.status:
          copy_from: jsonPayload.status
          type: integer
  service:
    pipelines:
      chatisen_containers:
        receivers: [chatisen_containers]
        processors: [docker, services, fields, sanitized]
