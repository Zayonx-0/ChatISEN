events { worker_connections 1024; }
http { include /etc/nginx/mime.types; default_type application/octet-stream; sendfile on;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream api { server api:3000; }
  upstream web { server web:80; }
  server { listen 80; server_name _; client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy no-referrer always;
    location /api/ws { proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; }
    location /api/ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /healthz { proxy_pass http://api; }
    location /metrics { proxy_pass http://api; }
    location / { proxy_pass http://web; proxy_set_header Host $host; }
  }
}
