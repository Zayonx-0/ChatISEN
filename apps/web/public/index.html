<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatISEN</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#182338;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.card{background:#fff;border-radius:20px;box-shadow:0 20px 50px #16203318;padding:32px;width:min(430px,100%)}h1{font-size:3rem;margin:0 0 8px;letter-spacing:-.06em}h2{margin:0 0 14px}.auth p{color:#66748a}.auth form{display:grid;gap:14px}.auth label{display:grid;gap:6px;color:#66748a;font-size:.9rem}.auth input,.search,.compose input{border:1px solid #d9e0ed;border-radius:10px;padding:12px;outline:0;font:inherit}.auth input:focus,.search:focus,.compose input:focus{border-color:#3166e8;box-shadow:0 0 0 3px #3166e822}.primary{background:#3166e8;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.link,.ghost{background:none;border:0;color:#3166e8;cursor:pointer}.error{background:#fff0f0;color:#b51e3a;border-radius:8px;padding:10px;font-size:.9rem}.shell{min-height:100vh}.top{height:70px;background:#fff;border-bottom:1px solid #e5eaf2;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:10px}.logo{display:grid;place-items:center;width:34px;height:34px;background:#3166e8;color:#fff;border-radius:10px}.online{color:#68768c;font-size:.9rem}.layout{height:calc(100vh - 70px);display:grid;grid-template-columns:320px 1fr;max-width:1400px;margin:auto;background:#fff}.side{border-right:1px solid #e5eaf2;padding:20px;overflow:auto}.sidehead{display:flex;justify-content:space-between;align-items:center}.side h2{font-size:1.05rem}.search{width:100%;margin:8px 0}.results{border:1px solid #e2e7f0;border-radius:10px;overflow:hidden}.results button{width:100%;text-align:left;background:#fff;border:0;padding:10px;cursor:pointer}.results span{display:block;color:#68768c;font-size:.85rem}.conv{display:flex;align-items:center;gap:10px;width:100%;padding:12px 8px;border:0;border-radius:10px;background:#fff;text-align:left;cursor:pointer}.conv:hover,.conv.active{background:#eef3ff}.avatar{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#e7edff;color:#3166e8;font-weight:700;flex:none}.conv b,.conv small{display:block}.conv small{color:#7d899e;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;min-width:0}.chathead{padding:20px 28px;border-bottom:1px solid #e5eaf2;display:flex;justify-content:space-between}.chathead h2{font-size:1.1rem;margin:0}.chathead small{color:#7d899e}.actions button{border:0;background:#eef3ff;color:#3166e8;border-radius:9px;padding:9px;margin-left:6px;font-size:1.05rem;cursor:pointer}.messages{padding:24px 8%;overflow:auto;background:#fbfcff}.msg{display:flex;margin:8px 0}.msg.mine{justify-content:flex-end}.bubble{max-width:min(70%,560px);background:#fff;border:1px solid #e4e9f2;border-radius:14px 14px 14px 4px;padding:10px 14px;box-shadow:0 3px 8px #16203308}.mine .bubble{color:#fff;background:#3166e8;border-color:#3166e8;border-radius:14px 14px 4px 14px}.meta{font-size:.8rem;display:flex;gap:8px}.meta time{opacity:.65}.bubble p{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}.compose{display:flex;gap:10px;padding:18px 8%;border-top:1px solid #e5eaf2}.compose input{flex:1}.call{position:fixed;inset:0;background:#18233888;display:grid;place-items:center}.call .card{text-align:center}.media{height:150px;border-radius:14px;background:#182338;color:#fff;display:grid;place-items:center;font-size:3rem;margin:14px 0}.danger{background:#fff0f0;color:#c22c46;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}@media(max-width:800px){.layout{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.side{max-height:35vh;border-right:0;border-bottom:1px solid #e5eaf2;padding:10px}.chat{min-height:0}.bubble{max-width:88%}.top{padding:0 12px}.chathead{padding:12px}.messages{padding:12px}.compose{padding:10px}.compose input{min-width:0}}</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),api=async(p,o={})=>{const r=await fetch(p,{credentials:'include',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error?.message||'Erreur');return j};let state={user:null,csrf:'',convs:[],selected:null,messages:[],ws:null,call:null};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function auth(){document.body.innerHTML='<div class="auth"><div class="card"><div class="logo">✦</div><h1>ChatISEN</h1><p>Messagerie, groupes et appels temps réel.</p><form id="af"><label>Identifiant<input name="handle" value="alice" required pattern="[a-z0-9_]{3,32}"></label><label>Nom affiché<input name="displayName" value="Alice"></label><label>Mot de passe<input type="password" name="password" value="password123" minlength="8" required></label><div id="ae"></div><button class="primary">Se connecter</button><button type="button" class="link" id="register">Créer un compte</button></form></div></div>';let register=false;$('#register').onclick=()=>{register=!register;$('#register').textContent=register?'J’ai déjà un compte':'Créer un compte';$('#af').querySelector('.primary').textContent=register?'S’inscrire':'Se connecter'};$('#af').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{const j=await api('/api/auth/'+(register?'register':'login'),{method:'POST',body:JSON.stringify(b)});state.user=j.user;state.csrf=j.csrf;await load()}catch(x){$('#ae').innerHTML='<div class="error">'+esc(x.message)+'</div>'}}}
async function load(){const j=await api('/api/conversations');state.convs=j.conversations;render();if(state.convs[0])await select(state.convs[0]);}
function render(){document.body.innerHTML='<div class="shell"><header class="top"><div class="brand"><span class="logo">✦</span>ChatISEN</div><div class="online">● En ligne · '+esc(state.user.displayName)+' <button class="ghost" id="logout">Déconnexion</button></div></header><div class="layout"><aside class="side"><div class="sidehead"><h2>Conversations</h2></div><input class="search" id="search" placeholder="Rechercher un handle"><div id="results"></div><div id="convs"></div></aside><main class="chat"><div class="chathead"><div><h2 id="ct">Sélectionnez une conversation</h2><small id="cm"></small></div><div class="actions"><span title="Les appels audio et vidéo ne sont pas encore disponibles">Appels bientôt disponibles</span></div></div><div id="app-error" class="error" role="alert" hidden></div><div class="messages" id="messages"><div style="display:grid;place-items:center;height:100%;color:#7d899e">Commencez une conversation.</div></div><form class="compose" id="compose"><input id="text" placeholder="Écrire un message…" aria-label="Message"><button class="primary">Envoyer</button></form></main></div><div id="modal"></div></div>';$('#logout').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'});state.ws?.close();state.user=null;state.selected=null;state.messages=[];auth()}catch(e){showError(e)}};$('#compose').onsubmit=send;$('#search').oninput=search;drawConvs();}
function showError(error){const el=$('#app-error');if(el){el.textContent=error instanceof Error?error.message:String(error);el.hidden=false}}
function drawConvs(){const el=$('#convs');if(!el)return;el.innerHTML=state.convs.map(c=>{const other=c.members?.find(x=>x.id!==state.user.id);const name=(c.type==='direct'?other?.displayName:c.title)||'Conversation';return '<button class="conv '+(state.selected?.id===c.id?'active':'')+'" data-id="'+c.id+'"><span class="avatar">'+esc(name[0])+'</span><span><b>'+esc(name)+'</b><small>'+esc(c.lastMessage?.text||'Aucun message')+'</small></span></button>'}).join('');el.querySelectorAll('.conv').forEach(b=>b.onclick=()=>select(state.convs.find(c=>c.id===b.dataset.id)).catch(showError));}
async function search(e){const q=e.target.value;if(q.length<2)return $('#results').innerHTML='';try{const j=await api('/api/users/search?q='+encodeURIComponent(q));$('#results').innerHTML='<div class="results">'+j.users.filter(x=>x.id!==state.user.id).map(x=>'<button data-id="'+x.id+'"><b>@'+esc(x.handle)+'</b><span>'+esc(x.displayName)+'</span></button>').join('')+'</div>';$('#results').querySelectorAll('button').forEach(b=>b.onclick=async()=>{try{const j=await api('/api/conversations',{method:'POST',headers:{'x-csrf-token':state.csrf},body:JSON.stringify({type:'direct',memberIds:[b.dataset.id]})});state.convs=[j.conversation,...state.convs.filter(c=>c.id!==j.conversation.id)];$('#results').innerHTML='';drawConvs();await select(j.conversation)}catch(error){showError(error)}})}catch(error){showError(error)}}
async function select(c){if(!c)return;state.selected=c;drawConvs();$('#ct').textContent=(c.type==='direct'?c.members?.find(x=>x.id!==state.user.id)?.displayName:c.title)||'Conversation';$('#cm').textContent=(c.members?.length||0)+' participant(s)';const j=await api('/api/conversations/'+c.id+'/messages');state.messages=j.messages;drawMessages();if(state.ws)state.ws.close();state.ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/api/ws');state.ws.onopen=()=>state.ws.send(JSON.stringify({subscribe:'conversation:'+c.id}));state.ws.onmessage=e=>{const x=JSON.parse(e.data);if(x.type==='message.created'&&x.conversationId===c.id&&!state.messages.some(m=>m.id===x.message.id)){state.messages.push(x.message);drawMessages()}if(x.type==='call.invitation'){state.call=x.call;drawCall()}}}
function drawMessages(){const el=$('#messages');if(!el)return;el.innerHTML=state.messages.map(m=>'<div class="msg '+(m.sender.id===state.user.id?'mine':'')+'"><div class="bubble"><div class="meta"><b>'+esc(m.sender.displayName)+'</b><time>'+new Date(m.createdAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'</time></div><p>'+esc(m.text)+'</p></div></div>').join('');el.scrollTop=el.scrollHeight}
async function send(e){e.preventDefault();const input=$('#text'),button=e.currentTarget.querySelector('button'),conversation=state.selected;if(!conversation||!input.value.trim()||button.disabled)return;const text=input.value;button.disabled=true;try{const j=await api('/api/conversations/'+conversation.id+'/messages',{method:'POST',headers:{'x-csrf-token':state.csrf},body:JSON.stringify({text,clientMessageId:crypto.randomUUID()})});if(state.selected?.id===conversation.id){if(!state.messages.some(m=>m.id===j.message.id))state.messages.push(j.message);if(input.value===text)input.value='';drawMessages();$('#app-error').hidden=true}}catch(error){showError(error)}finally{button.disabled=false}}
async function startCall(kind){if(!state.selected)return;const j=await api('/api/conversations/'+state.selected.id+'/calls',{method:'POST',headers:{'x-csrf-token':state.csrf},body:JSON.stringify({kind})});state.call=j.call;drawCall()};function drawCall(){if(!state.call)return $('#modal').innerHTML='';const incoming=state.call.status==='ringing'&&state.call.initiatorId!==state.user.id;$('#modal').innerHTML='<div class="call"><div class="card"><div class="logo" style="margin:auto">'+(state.call.kind==='video'?'▣':'☎')+'</div><h2>'+(incoming?'Appel entrant':'Appel en cours')+'</h2><p>'+esc(state.selected?.title||'Conversation')+'</p>'+(incoming?'<button class="danger" id="reject">Refuser</button> <button class="primary" id="accept">Accepter</button>':'<div class="media">🎥<small style="font-size:.8rem">Flux média prêt</small></div><button class="danger" id="hang">Raccrocher</button>')+'</div></div>';if($('#accept'))$('#accept').onclick=async()=>{const j=await api('/api/calls/'+state.call.id+'/answer',{method:'POST',headers:{'x-csrf-token':state.csrf},body:JSON.stringify({action:'accept'})});state.call=j.call;drawCall()};if($('#reject'))$('#reject').onclick=()=>{$('#modal').innerHTML='';state.call=null};if($('#hang'))$('#hang').onclick=()=>{state.call=null;drawCall()}}
api('/api/auth/me').then(async j=>{state.user=j.user;state.csrf=j.csrf;await load()}).catch(auth);
</script></body></html>
