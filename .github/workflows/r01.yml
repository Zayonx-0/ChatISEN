name: R01 — contrôles automatisés
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    name: Builds, tests et configuration Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chatisen
          POSTGRES_PASSWORD: chatisen
          POSTGRES_DB: chatisen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatisen -d chatisen_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://chatisen:chatisen@localhost:5432/chatisen_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Installer les dépendances verrouillées
        run: pnpm install --frozen-lockfile
      - name: Valider la configuration Compose
        run: docker compose -f infra/compose/docker-compose.yml config --quiet
      - name: Tester l’agent de déploiement continu
        run: |
          bash -n ops/gcp/cd/install-cd.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s ops/gcp/cd -v
      - name: Vérifier les types
        run: pnpm typecheck
      - name: Compiler les applications
        run: pnpm build
      - name: Exécuter les tests disponibles
        run: pnpm test
      - name: Installer Chromium pour Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Parcours navigateur v1 sur PostgreSQL
        run: pnpm test:e2e
      - name: Conserver les traces navigateur synthétiques
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r01-playwright-traces
          path: artifacts/playwright-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Préciser la portée des contrôles
        if: always()
        run: |
          {
            echo '## Portée des contrôles R01'
            echo 'Ce workflow vérifie uniquement les builds, les tests disponibles et la configuration Compose.'
            echo 'La recette J1 reste ouverte : les médias reçus, le parcours complet Compose/HTTPS et Grafana ne sont pas démontrés.'
            echo 'La publication v1.1.0 reste soumise à make verify LEVEL=core et aux critères du mandat R01.'
          } >> "$GITHUB_STEP_SUMMARY"

  # La VM vient chercher la version : ce job ne détient aucun secret et n'écrit rien.
  # Il attend que le site annonce le commit, pour que GitHub montre le résultat réel.
  deploy:
    name: Déploiement en production
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions: {}
    concurrency:
      group: deploiement-production
      cancel-in-progress: true
    environment:
      name: production
      url: https://ia-pple.isen.fedyna.fr
    steps:
      - name: Attendre que la VM confirme ce commit
        env:
          VERSION_URL: https://ia-pple.isen.fedyna.fr/version.json
        run: |
          for attempt in $(seq 1 60); do
            body=$(curl -fsS --max-time 10 "$VERSION_URL" || echo '{}')
            read -r commit status target < <(jq -r '[.commit // "-", .status // "-", .target // "-"] | @tsv' <<<"$body" || printf -- '- - -\n')
            if [[ $commit == "$GITHUB_SHA" && $status == deployed ]]; then
              echo "En production : $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ $target == "$GITHUB_SHA" && ( $status == rolled_back || $status == blocked || $status == broken ) ]]; then
              # Le contrôle de CI peut arriver juste après un blocage devenu caduc.
              if [[ $status != blocked || $attempt -gt 12 ]]; then
                echo "::error::$status : $(jq -r '.reason' <<<"$body")"
                exit 1
              fi
            fi
            sleep 10
          done
          echo "::error::La VM n’a pas confirmé le commit en 10 minutes (journalctl -u chatisen-deploy)"
          exit 1
