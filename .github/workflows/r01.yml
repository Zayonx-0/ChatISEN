name: R01 core
on:
  pull_request:
  push:
    branches: [rev/01-socle-j1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chatisen
          POSTGRES_PASSWORD: chatisen
          POSTGRES_DB: chatisen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatisen -d chatisen_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://chatisen:chatisen@localhost:5432/chatisen_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Compose configuration
        run: docker compose -f infra/compose/docker-compose.yml config --quiet
      - name: Verify R01 core
        run: make verify LEVEL=core
