name: R01 — contrôles automatisés
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    name: Contrats, sécurité, builds et tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chatisen
          POSTGRES_PASSWORD: chatisen
          POSTGRES_DB: chatisen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatisen -d chatisen_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://chatisen:chatisen@localhost:5432/chatisen_test
      TEST_EDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Installer les dépendances verrouillées
        run: pnpm install --frozen-lockfile
      - name: Auditer les dépendances JavaScript
        run: pnpm audit --audit-level high
      - name: Analyser le dépôt avec Trivy
        run: |
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 fs \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src
      - name: Vérifier les frontières des modules
        run: node scripts/check-boundaries.mjs
      - name: Charger le schéma officiel OpenAPI 3.1
        run: |
          curl --fail --silent --show-error --location https://spec.openapis.org/oas/3.1/schema/2022-10-07 \
            --output "$RUNNER_TEMP/openapi-3.1.json"
          echo "OPENAPI_META_SCHEMA=$RUNNER_TEMP/openapi-3.1.json" >> "$GITHUB_ENV"
      - name: Valider la configuration Compose
        run: |
          docker compose -f infra/compose/docker-compose.yml config --quiet
          docker compose -f infra/compose/docker-compose.yml run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
      - name: Tester l’agent de déploiement continu
        run: |
          bash -n ops/gcp/cd/install-cd.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s ops/gcp/cd -v
      - name: Tester les outils d’études
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 analysis/test_quality.py
          node --test tests/load/synthese.test.mjs
      - name: Vérifier les types
        run: pnpm typecheck
      - name: Compiler les applications
        run: pnpm build
      - name: Exécuter les tests disponibles
        run: pnpm test
      - name: Installer Chromium pour Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Parcours navigateur v1 sur PostgreSQL
        run: pnpm test:e2e
      - name: Conserver les traces navigateur synthétiques
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r01-playwright-traces
          path: artifacts/playwright-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Préciser la portée des contrôles
        if: always()
        run: |
          {
            echo '## Portée des contrôles R01'
            echo 'Ce workflow vérifie les contrats, les dépendances, les builds, les tests et la configuration Compose.'
            echo 'La recette J1 reste ouverte : les médias reçus, le parcours complet Compose/HTTPS et Grafana ne sont pas démontrés.'
            echo 'La publication v1.1.0 reste soumise à make verify LEVEL=core et aux critères du mandat R01.'
          } >> "$GITHUB_STEP_SUMMARY"

  images:
    name: Images — construction, analyse et démarrage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chatisen_images
          POSTGRES_USER: chatisen
          POSTGRES_PASSWORD: chatisen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatisen -d chatisen_images"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Construire les images livrées
        run: |
          docker build --pull --file apps/api/Dockerfile --tag chatisen-api:ci .
          docker build --pull --file infra/gcp/edge/Dockerfile --tag chatisen-edge:ci .
      - name: Migrer puis démarrer l’image de l’API
        env:
          DATABASE_URL: postgres://chatisen:chatisen@localhost:5432/chatisen_images
        run: |
          docker run --rm --network host -e DATABASE_URL chatisen-api:ci node db/migrate.mjs
          docker run --detach --name api --network host -e DATABASE_URL \
            -e CSRF_SECRET=secret-reserve-a-la-ci -e CORS_ORIGIN=https://exemple.invalid chatisen-api:ci
          for _ in $(seq 30); do
            if curl --fail --silent http://127.0.0.1:3000/readyz; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
      - name: Analyser l’image de l’API avec Trivy
        run: bash infra/gcp/cd/scan.sh chatisen-api:ci
      - name: Analyser l’image Nginx avec Trivy
        if: success() || failure()
        run: bash infra/gcp/cd/scan.sh chatisen-edge:ci
