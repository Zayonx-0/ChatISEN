name: Cible — images et déploiement
# Flux T18 et T19 : après des tests réussis sur main, la CI construit les images, les envoie
# au registre et les déploie avec une identité fédérée (aucune clé stockée). L'accès GCP
# n'est accordé qu'à main et à l'environnement « cible ».
on:
  workflow_run:
    workflows: ['R01 — contrôles automatisés']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement à la fois ; un déploiement commencé n'est jamais interrompu.
concurrency:
  group: cible
  cancel-in-progress: false

env:
  REGISTRY: europe-west4-docker.pkg.dev/project-fd23d3d9-a7e8-4002-a7a/chatisen
  RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    name: Construire et publier les images
    # Un push de ce dépôt dont les tests ont réussi, ou un lancement manuel sur main.
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cible
    permissions:
      contents: read
      id-token: write
    outputs:
      api: ${{ steps.publish.outputs.api }}
      edge: ${{ steps.publish.outputs.edge }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE }}
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/424540770012/locations/global/workloadIdentityPools/github/providers/chatisen
          service_account: sa-deploy@project-fd23d3d9-a7e8-4002-a7a.iam.gserviceaccount.com
          token_format: access_token
      - uses: docker/login-action@v3
        with:
          registry: europe-west4-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Construire et publier
        id: publish
        run: |
          set -euo pipefail
          for name in api edge; do
            dockerfile=apps/api/Dockerfile
            [[ $name == edge ]] && dockerfile=infra/gcp/edge/Dockerfile
            digest=$(bash infra/gcp/cd/publish.sh "$name" "$dockerfile")
            echo "$name=$digest" >> "$GITHUB_OUTPUT"
            echo "- $name : \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done

  deploy:
    name: Déployer sur la cible
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: cible
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE }}
      - name: Ignorer une version déjà dépassée
        id: recent
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ $head == "$RELEASE" ]]; then echo "deploy=true" >> "$GITHUB_OUTPUT"
          else echo "main a avancé : la version suivante sera déployée." >> "$GITHUB_STEP_SUMMARY"; fi
      - if: steps.recent.outputs.deploy == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/424540770012/locations/global/workloadIdentityPools/github/providers/chatisen
          service_account: sa-deploy@project-fd23d3d9-a7e8-4002-a7a.iam.gserviceaccount.com
      - if: steps.recent.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - if: steps.recent.outputs.deploy == 'true'
        name: Migrer, remplacer les VM et vérifier
        run: bash infra/gcp/cd/deploy.sh "$API_IMAGE" "$EDGE_IMAGE"
        env:
          API_IMAGE: ${{ needs.images.outputs.api }}
          EDGE_IMAGE: ${{ needs.images.outputs.edge }}
