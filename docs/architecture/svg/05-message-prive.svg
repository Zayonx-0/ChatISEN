ext></g><g class="participant participant-head" data-participant="p5"><rect fill="#E8F1FA" height="30.4883" rx="2.5" ry="2.5" style="stroke:#38678E;stroke-width:0.5;" width="185.7256" x="1713.6196" y="75.4648"/><text fill="#10283F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="171.7256" x="1720.6196" y="96">Abonnements WebSocket</text></g><g class="message" data-participant-1="p0" data-participant-2="p1"><polygon fill="#37516E" points="440.0625,149.5742,450.0625,153.5742,440.0625,157.5742,444.0625,153.5742" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="52.3628" x2="446.0625" y1="153.5742" y2="153.5742"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="59.3628" y="141.1768">1</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.2725" x="71.9385" y="133.5215">Alice envoie texte et clientId : POST</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.5601" x="71.9385" y="148.832">/api/v1/conversations/{id}/messages.</text></g><g class="message" data-participant-1="p1" data-participant-2="p2"><polygon fill="#37516E" points="788.6509,178.8848,798.6509,182.8848,788.6509,186.8848,792.6509,182.8848" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="452.0625" x2="794.6509" y1="182.8848" y2="182.8848"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="459.0625" y="178.1426">2</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.0127" x="471.6382" y="178.1426">Contr&#244;le du cookie, de l&#8217;origine et du jeton CSRF.</text></g><g class="message" data-participant-1="p1" data-participant-2="p3"><polygon fill="#37516E" points="943.3813,208.1953,953.3813,212.1953,943.3813,216.1953,947.3813,212.1953" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="452.0625" x2="949.3813" y1="212.1953" y2="212.1953"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="459.0625" y="207.4531">3</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.3013" x="471.6382" y="207.4531">&#201;crit le message pour l&#8217;utilisateur authentifi&#233;.</text></g><g class="message" data-participant-1="p3" data-participant-2="p4"><polygon fill="#37516E" points="1385.7183,252.8164,1395.7183,256.8164,1385.7183,260.8164,1389.7183,256.8164" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="955.3813" x2="1391.7183" y1="256.8164" y2="256.8164"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="962.3813" y="244.4189">4</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="405.7612" x="974.957" y="236.7637">BEGIN. Verrouille conversation puis membre actif (FOR UPDATE).</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.3818" x="974.957" y="252.0742">Cherche la cl&#233; (conversation_id, sender_id, client_id).</text></g><g class="message" data-participant-1="p3" data-participant-2="p4"><polygon fill="#37516E" points="1385.7183,297.4375,1395.7183,301.4375,1385.7183,305.4375,1389.7183,301.4375" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="955.3813" x2="1391.7183" y1="301.4375" y2="301.4375"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="962.3813" y="289.04">5</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="380.9355" x="974.957" y="281.3848">Nouvelle cl&#233; : last_seq + 1, INSERT conversation_events puis</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.9243" x="974.957" y="296.6953">messages, COMMIT. Toute erreur annule les trois &#233;critures.</text></g><g class="message" data-participant-1="p1" data-participant-2="p0"><polygon fill="#37516E" points="63.3628,342.0586,53.3628,346.0586,63.3628,350.0586,59.3628,346.0586" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="57.3628" x2="451.0625" y1="346.0586" y2="346.0586"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="69.3628" y="333.6611">6</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.124" x="81.9385" y="326.0059">201 + Message. M&#234;me cl&#233; et texte : 200, m&#234;me ID. Texte</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.4951" x="81.9385" y="341.3164">diff&#233;rent : 409 IDEMPOTENCY_CONFLICT.</text></g><g class="message" data-participant-1="p4" data-participant-2="p5"><polygon fill="#37516E" points="1794.4824,401.9902,1804.4824,405.9902,1794.4824,409.9902,1798.4824,405.9902" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="1397.7183" x2="1800.4824" y1="405.9902" y2="405.9902"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="1404.7183" y="385.9375">7</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.1885" x="1417.2939" y="370.627">Seulement apr&#232;s un nouvel INSERT et son commit : NOTIFY</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="365.7646" x="1417.2939" y="385.9375">r&#233;veille les abonnements du fil. Un retry identique ne cr&#233;e</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.1021" x="1417.2939" y="401.248">aucun &#233;v&#233;nement.</text></g><g class="message" data-participant-1="p5" data-participant-2="p3"><polygon fill="#37516E" points="966.3813,431.3008,956.3813,435.3008,966.3813,439.3008,962.3813,435.3008" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="960.3813" x2="1805.4824" y1="435.3008" y2="435.3008"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="972.3813" y="430.5586">8</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.3071" x="984.957" y="430.5586">Revalide la session de Bob et son appartenance.</text></g><g class="message" data-participant-1="p5" data-participant-2="p4"><polygon fill="#37516E" points="1408.7183,460.6113,1398.7183,464.6113,1408.7183,468.6113,1404.7183,464.6113" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="1402.7183" x2="1805.4824" y1="464.6113" y2="464.6113"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="1414.7183" y="459.8691">9</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.4907" x="1427.2939" y="459.8691">Lit les &#233;v&#233;nements o&#249; seq &gt; curseur, dans l&#8217;ordre.</text></g><g class="message" data-participant-1="p5" data-participant-2="p0"><polygon fill="#37516E" points="63.3628,489.9219,53.3628,493.9219,63.3628,497.9219,59.3628,493.9219" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="57.3628" x2="1805.4824" y1="493.9219" y2="493.9219"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1