"stroke:#38678E;stroke-width:0.5;" width="174.0635" x="1714.4434" y="58.9766"/><text fill="#10283F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.0635" x="1721.4434" y="79.5117">Diffusion WebSocket v1</text></g><g class="message" data-participant-1="p0" data-participant-2="p1"><polygon fill="#37516E" points="440.0625,133.0859,450.0625,137.0859,440.0625,141.0859,444.0625,137.0859" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="52.3628" x2="446.0625" y1="137.0859" y2="137.0859"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="59.3628" y="124.6885">1</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.2725" x="71.9385" y="117.0332">Alice envoie texte et clientId : POST</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.5601" x="71.9385" y="132.3438">/api/v1/conversations/{id}/messages.</text></g><g class="message" data-participant-1="p1" data-participant-2="p2"><polygon fill="#37516E" points="788.6509,162.3965,798.6509,166.3965,788.6509,170.3965,792.6509,166.3965" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="452.0625" x2="794.6509" y1="166.3965" y2="166.3965"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="459.0625" y="161.6543">2</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.0127" x="471.6382" y="161.6543">Contr&#244;le du cookie, de l&#8217;origine et du jeton CSRF.</text></g><g class="message" data-participant-1="p1" data-participant-2="p3"><polygon fill="#37516E" points="938.374,191.707,948.374,195.707,938.374,199.707,942.374,195.707" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="452.0625" x2="944.374" y1="195.707" y2="195.707"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="459.0625" y="190.9648">3</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.3013" x="471.6382" y="190.9648">&#201;crit le message pour l&#8217;utilisateur authentifi&#233;.</text></g><g class="message" data-participant-1="p3" data-participant-2="p4"><polygon fill="#37516E" points="1380.7109,236.3281,1390.7109,240.3281,1380.7109,244.3281,1384.7109,240.3281" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="950.374" x2="1386.7109" y1="240.3281" y2="240.3281"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="957.374" y="227.9307">4</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="405.7612" x="969.9497" y="220.2754">BEGIN. Verrouille conversation puis membre actif (FOR UPDATE).</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.3818" x="969.9497" y="235.5859">Cherche la cl&#233; (conversation_id, sender_id, client_id).</text></g><g class="message" data-participant-1="p3" data-participant-2="p4"><polygon fill="#37516E" points="1380.7109,280.9492,1390.7109,284.9492,1380.7109,288.9492,1384.7109,284.9492" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="950.374" x2="1386.7109" y1="284.9492" y2="284.9492"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="957.374" y="272.5518">5</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="380.9355" x="969.9497" y="264.8965">Nouvelle cl&#233; : last_seq + 1, INSERT conversation_events puis</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.9243" x="969.9497" y="280.207">messages, COMMIT. Toute erreur annule les trois &#233;critures.</text></g><g class="message" data-participant-1="p1" data-participant-2="p0"><polygon fill="#37516E" points="63.3628,325.5703,53.3628,329.5703,63.3628,333.5703,59.3628,329.5703" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="57.3628" x2="451.0625" y1="329.5703" y2="329.5703"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="69.3628" y="317.1729">6</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.124" x="81.9385" y="309.5176">201 + Message. M&#234;me cl&#233; et texte : 200, m&#234;me ID. Texte</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.4951" x="81.9385" y="324.8281">diff&#233;rent : 409 IDEMPOTENCY_CONFLICT.</text></g><g class="message" data-participant-1="p4" data-participant-2="p5"><polygon fill="#37516E" points="1789.4751,385.502,1799.4751,389.502,1789.4751,393.502,1793.4751,389.502" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="1392.7109" x2="1795.4751" y1="389.502" y2="389.502"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="1399.7109" y="369.4492">7</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.1885" x="1412.2866" y="354.1387">Seulement apr&#232;s un nouvel INSERT et son commit : NOTIFY</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="365.7646" x="1412.2866" y="369.4492">r&#233;veille les abonnements du fil. Un retry identique ne cr&#233;e</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.1021" x="1412.2866" y="384.7598">aucun &#233;v&#233;nement.</text></g><g class="message" data-participant-1="p5" data-participant-2="p3"><polygon fill="#37516E" points="961.374,414.8125,951.374,418.8125,961.374,422.8125,957.374,418.8125" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="955.374" x2="1800.4751" y1="418.8125" y2="418.8125"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="967.374" y="414.0703">8</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.3071" x="979.9497" y="414.0703">Revalide la session de Bob et son appartenance.</text></g><g class="message" data-participant-1="p5" data-participant-2="p4"><polygon fill="#37516E" points="1403.7109,444.123,1393.7109,448.123,1403.7109,452.123,1399.7109,448.123" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="1397.7109" x2="1800.4751" y1="448.123" y2="448.123"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="1409.7109" y="443.3809">9</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.4907" x="1422.2866" y="443.3809">Lit les &#233;v&#233;nements o&#249; seq &gt; curseur, dans l&#8217;ordre.</text></g><g class="message" data-participant-1="p5" data-participant-2="p0"><polygon fill="#37516E" points="63.3628,473.4336,53.3628,477.4336,63.3628,481.4336,59.3628,477.4336" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="57.3628" x2="1800.4751" y1="477.4336" y2="477.4336"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1514" x="69.3628" y="472.6914">10</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.2612" x="90.5142" y="472.6914">Bob re&#231;oit message.created. React fusionne par ID.</text></g><!--SRC=[XLHDZ-964BtpAqgxbrs501w6MUB3Ik0n4TBm4M0JhOGqQkmoz8pTxVG7ir4KATVyXBtjBI7dI56kyJ_9Bqbrcvc5QAGS4BRxrQkgLwzQttDHCiKAsB3aVgka5MaaSwdWOSSDDlJJkTwnL3vmiOMCvVhq9CMCsToCf31JLY0icT1BL3nx7bFJlmmw5_tkw3G1VczH93Xdol24bqoOuNzgUXdtHy5ey3z1KgMeZW7T_jMRVlnCm0tFw2Vm3Ds_7bmDesVG0wNamoFbcrvm5JTsF4N8f3GR-Q71h9725XjK3SDDZj3fmTz_GYpsaaFwpyyVhO02jMPRX5BnVNLOYq7E4mJK1X8f12QcEj2hWQ7S-AzfTRYhFW7Rq6br06OXutchKNxk55v4EKVwNo1Bp0jW6ihEEM0XhK5DyhiaUrIQ6Iv53GtEeUEKg3XLuOhGL2m1TOsyE4SEagJwJSDSQhDLkFpcfaPrpr53fdq_Tz8gmV8QStcEkUPPPbqY-0utIvdS4tuVrD1Ue-p0bs-fpX2EMZav4Gn-C9uvyTsFKmXXFbkkrgBDIjxU1-tJNdNxHvx-r3wghqd0mBDUX12H6rNr1uqhjQIFlEVOT5BbD32f-9RiuTBGuHtIV25QBaPFyTqGgbyInGrG_DDigLSVRWtFEHM0z4xcs3bfCruTABphmoz36CPVZwSj-1R9N9Rd-VcCeBHS4t6nKGWqNfx1gz5i0U_cruDL_Bgr5j4ELRAZSXafGMDxTHf-ozCcJL6GkVrZhHKzlZujOIhj7drcHn0IbJQtP7hu0e8cZAVBUB4wg-eMzqIZVN5hyIXg4wBPP39UjM3b_0RKaMzS24lSEHdGA4dTL0Sdc5KdO-Y4SD49AD-avch1fFgzE1P4ujV3Tg1E4mf_DBwcFExpMgJad-gWt0w4SDdvYixYoNosYgVH-zjeDXtTZACLvRhqkNeXB94gAXoUbSgPc1PJU14UktNc9_KJMHJSiKvdg_7e_Lgewh17FoNNZzzAJwITFzncmZi12etw0RZV9BevW0oKK21Locn2gOYZEjHnL5NlqKWBtBFStISqokFcEH_wcw0kXvLkRr0mkeoU8cc0Dzv_-fHOWwp-SZSNl8N4AasJ85VJdNpqTQe-Cv3wBed2wbT9JCTvjXA5PDsqLLyiKAyezK8rEFN_1G00]--></g></svg>