<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="833px" preserveAspectRatio="none" style="width:1986px;height:833px;background:#FFFFFF;" version="1.1" viewBox="0 0 1986 833" width="1986px" zoomAndPan="magnify"><title>Recette R01 &#183; &#233;criture transactionnelle d&#8217;un message v1</title><defs/><g><g class="title" data-source-line="30"><text fill="#17334D" font-family="sans-serif" font-size="21" font-weight="bold" lengthAdjust="spacing" textLength="609.7793" x="684.6104" y="35.3027">Recette R01 &#183; &#233;criture transactionnelle d&#8217;un message v1</text></g><!--class browser--><g class="entity" data-entity="browser" data-source-line="32" data-uid="ent0002" id="entity_browser"><rect fill="#E6F2FA" height="191.9961" rx="4" ry="4" style="stroke:#49799A;stroke-width:0.5;" width="511.4775" x="270.5" y="95.2324"/><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="163.8647" x="444.3064" y="119.7344">main.tsx &#183; Client React</text><line style="stroke:#49799A;stroke-width:0.5;" x1="271.5" x2="780.9775" y1="132.8984" y2="132.8984"/><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="83.9063" x="281.5" y="156.4004">send(event)</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="294.624" x="281.5" y="184.0664">api&lt;T&gt;(path, RequestInit) : Promise&lt;T&gt;</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="291.145" x="281.5" y="211.7324">upsert(messages, incoming) : Message[]</text><line style="stroke:#49799A;stroke-width:1;" x1="271.5" x2="780.9775" y1="223.8965" y2="223.8965"/><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="445.9131" x="281.5" y="247.3984">pending[conversationId] garde le clientId du m&#234;me brouillon.</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="489.4775" x="281.5" y="275.0645">Apr&#232;s 201/200 ou message.created, fusion par id et tri BigInt(seq).</text></g><!--class route--><g class="entity" data-entity="route" data-source-line="41" data-uid="ent0003" id="entity_route"><rect fill="#E6F2FA" height="247.3281" rx="4" ry="4" style="stroke:#49799A;stroke-width:0.5;" width="497.7959" x="1027" y="67.7324"/><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="227.6367" x="1162.0796" y="92.2344">chat/postgres-routes.ts &#183; HTTP</text><line style="stroke:#49799A;stroke-width:0.5;" x1="1028" x2="1523.7959" y1="105.3984" y2="105.3984"/><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="231.3354" x="1038" y="128.9004">registerPostgresChat(app, repo)</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="144.9683" x="1038" y="156.5664">mutation(req, reply)</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="224.2822" x="1038" y="184.2324">messageDto(PostgresMessage)</text><line style="stroke:#49799A;stroke-width:1;" x1="1028" x2="1523.7959" y1="196.3965" y2="196.3965"/><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="422.395" x="1038" y="219.8984">POST /api/v1/conversations/{id}/messages, {clientId,text}</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="468.8306" x="1038" y="247.5645">Session, Origin exact, x-csrf-token, membre actif, UUID valides.</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="462.063" x="1038" y="275.2305">Fil inconnu ou non autoris&#233; : 404. Texte vide ou &gt; 4 000 : 400.</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="475.7959" x="1038" y="302.8965">201 si created, 200 si r&#233;p&#233;tition identique, 409 si texte diff&#233;rent.</text></g><!--class repository--><g class="entity" data-entity="repository" data-source-line="52" data-uid="ent0004" id="entity_repository"><rect fill="#E6F2FA" height="357.9922" rx="4" ry="4" style="stroke:#49799A;stroke-width:0.5;" width="523.7969" x="1456" y="396.7324"/><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="329.48" x="1553.1584" y="421.2344">repositories/postgres.ts &#183; PostgresRepository</text><line style="stroke:#49799A;stroke-width:0.5;" x1="1457" x2="1978.7969" y1="434.3984" y2="434.3984"/><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="101.0376" x="1467" y="457.9004">pool : pg.Pool</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="396.5112" x="1467" y="485.5664">isMember(conversationId, userId) : Promise&lt;boolean&gt;</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="406.875" x="1467" y="513.2324">appendMessage(conversationId, senderId, text, clientId)</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="408.252" x="1467" y="540.8984">r&#233;sultat : {message: PostgresMessage, created: boolean}</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="178.2275" x="1467" y="568.5645">transaction(fn) : Promise</text><line style="stroke:#49799A;stroke-width:1;" x1="1457" x2="1978.7969" y1="580.7285" y2="580.7285"/><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="419.6777" x="1467" y="604.2305">BEGIN sur un client du pool. FOR UPDATE dans cet ordre :</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="501.7969" x="1467" y="631.8965">1. conversations, fil ouvert. 2. conversation_members, membre actif.</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="343.3374" x="1467" y="659.5625">Cherche (conversation_id, sender_id, client_id).</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="494.1724" x="1467" y="687.2285">Si m&#234;me texte : renvoie la ligne. Autre texte : idempotency_conflict.</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="467.6733" x="1467" y="714.8945">Sinon : incr&#233;mente last_seq, INSERT event puis INSERT message.</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="337.9321" x="1467" y="742.5605">COMMIT ou ROLLBACK, et lib&#232;re la connexion.</text></g><!--entity journal--><g class="entity" data-entity="journal" data-source-line="67" data-uid="ent0005" id="entity_journal"><path d="M788.5,504.2324 C788.5,494.2324 1000.9243,494.2324 1000.9243,494.2324 C1000.9243,494.2324 1213.3486,494.2324 1213.3486,504.2324 L1213.3486,646.8945 C1213.3486,656.8945 1000.9243,656.8945 1000.9243,656.8945 C1000.9243,656.8945 788.5,656.8945 788.5,646.8945 L788.5,504.2324" fill="#EDF3F7" style="stroke:#181818;stroke-width:0.5;"/><path d="M788.5,504.2324 C788.5,514.2324 1000.9243,514.2324 1000.9243,514.2324 C1000.9243,514.2324 1213.3486,514.2324 1213.3486,504.2324" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#17334D" font-family="sans-serif" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="216.4087" x="803.5" y="537.7344">PostgreSQL &#183; 001_initial.sql</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="4.7461" x="803.5" y="555.4004">&#160;</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="266.7993" x="803.5" y="573.0664">conversations : PK id, last_seq bigint</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="391.4941" x="803.5" y="590.7324">conversation_members : PK (conversation_id, user_id)</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="343.3081" x="803.5" y="608.3984">conversation_events : PK (conversation_id, seq)</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="394.8486" x="803.5" y="626.0645">messages : FK (conversation_id, seq) vers l&#8217;&#233;v&#233;nement</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="335.0317" x="803.5" y="643.7305">UNIQUE (conversation_id, sender_id, client_id)</text></g><!--class websocket--><g class="entity" data-entity="websocket" data-source-line="69" data-uid="ent0006" id="entity_websocket"><rect fill="#E6F2FA" height="247.3281" rx="4" ry="4" style="stroke:#49799A;stroke-width:0.5;" width="550.3398" x="6" y="452.2324"/><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="262.6172" x="149.8613" y="476.7344">chat/postgres-websocket.ts &#183; WS v1</text><line style="stroke:#49799A;stroke-width:0.5;" x1="7" x2="555.3398" y1="489.8984" y2="489.8984"/><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="275.6616" x="17" y="513.4004">registerPostgresWebsocket(app, repo)</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="332.688" x="17" y="541.0664">authorized(subscription) : Promise&lt;boolean&gt;</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="264.1992" x="17" y="568.7324">drain(subscription) : Promise&lt;void&gt;</text><line style="stroke:#49799A;stroke-width:1;" x1="7" x2="555.3398" y1="580.8965" y2="580.8965"/><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="393.3398" x="17" y="604.3984">/api/v1/ws re&#231;oit subscribe(conversationId, afterSeq).</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="419.729" x="17" y="632.0645">Reprend avec seq &gt; curseur, ordre croissant, lots de 100.</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="450.5493" x="17" y="659.7305">V&#233;rifie session et appartenance avant lecture et chaque envoi.</text><text fill="#17334D" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="528.3398" x="17" y="687.3965">Le serveur envoie seq en cha&#238;ne et remplace data.messageId par data.id.</text></g><g class="link" data-entity-1="browser" data-entity-2="route" data-uid="lnk7" id="link_browser_route"><polygon fill="#45647D" points="1026.6875,191.2324,1017.6875,187.2324,1021.6875,191.2324,1017.6875,195.2324,1026.6875,191.2324" style="stroke:#45647D;stroke-width:1;"/><path d="M781.7478,191.2324 C860.9042,191.2324 941.9732,191.2324 1020.6875,191.2324" fill="none" style="stroke:#45647D;stroke-width:1;"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.501" x="855.6152" y="162.7676">JSON + cookie</text><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.2314" x="846.25" y="179.2559">+ X-CSRF-Token</text></g><g class="link" data-entity-1="route" data-entity-2="repository" data-uid="lnk8" id="link_route_repository"><polygon fill="#45647D" points="1511.9157,396.3902,1507.7276,387.4761,1508.1348,393.1183,1502.4926,393.5255,1511.9157,396.3902" style="stroke:#45647D;stroke-width:1;"/><path d="M1417.6754,314.8361 C1447.7236,340.8394 1475.4906,364.8685 1507.3786,392.4639" fill="none" style="stroke:#45647D;stroke-width:1;"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="338.9326" x="1490" y="361.2676">appendMessage(cid, uid, body.text, body.clientId)</text></g><g class="link" data-entity-1="journal" data-entity-2="repository" data-uid="lnk10" id="link_journal_repository"><polygon fill="#45647D" points="1213.6978,575.7324,1222.6978,579.7324,1218.6978,575.7324,1222.6978,571.7324,1213.6978,575.7324" style="stroke:#45647D;stroke-width:1;"/><path d="M1219.6978,575.7324 C1295.6658,575.7324 1376.1626,575.7324 1455.8094,575.7324" fill="none" style="stroke:#45647D;stroke-width:1;"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.5449" x="1229.25" y="547.2676">verrouille, &#233;crit et rend durable</text><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.8516" x="1262.0967" y="563.7559">avec un seul COMMIT</text></g><g class="link" data-entity-1="websocket" data-entity-2="journal" data-uid="lnk12" id="link_websocket_journal"><polygon fill="#45647D" points="556.026,575.7324,565.026,579.7324,561.026,575.7324,565.026,571.7324,556.026,575.7324" style="stroke:#45647D;stroke-width:1;"/><path d="M562.026,575.7324 C639.0622,575.7324 715.6043,575.7324 788.4198,575.7324" fill="none" style="stroke:#45647D;stroke-width:1;"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.9658" x="595.3066" y="547.2676">NOTIFY apr&#232;s COMMIT</text><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="201.0791" x="571.75" y="563.7559">chatisen_conversation_events</text></g><g class="link" data-entity-1="browser" data-entity-2="websocket" data-uid="lnk14" id="link_browser_websocket"><polygon fill="#45647D" points="465.1234,287.2744,456.9008,292.6956,462.4266,291.4848,463.6374,297.0105,465.1234,287.2744" style="stroke:#45647D;stroke-width:1;"/><path d="M461.8872,292.3269 C430.0006,342.1091 393.8177,398.5986 359.6445,451.9507" fill="none" style="stroke:#45647D;stroke-width:1;"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="192.6709" x="463.519" y="353.2676">&#233;v&#233;nement message.created</text><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="239.709" x="440" y="369.7559">React avance le curseur &#224; r&#233;ception</text></g><g class="legend" data-source-line="86"><rect fill="#F4F8FB" height="52.9766" rx="4" ry="4" style="stroke:#AABCCA;stroke-width:1;" width="818.4443" x="580.2778" y="760.7324"/><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="126.1504" x="590.2778" y="784.2676">Test de r&#233;f&#233;rence</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="659.0049" x="729.7173" y="784.2676">Deux requ&#234;tes identiques &#8594; un seul ID, un message, un &#233;v&#233;nement et une seule incr&#233;mentation.</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="748.8564" x="590.2778" y="800.7559">Contr&#244;le de reprise : apr&#232;s 15 s hors ligne, retrouver les 20 messages manqu&#233;s une seule fois et dans l&#8217;ordre.</text></g><!--SRC=[ZLTDKoD74hthLwJ75n6MXCHeO51C424XjAir0nW9VuHn4ANkabHBTtLFLRK0Jqp4dlO7-ERRtjRuiAUDsFlgd_YN-6MrMhJu2Fi0I9MPLLalNxvAFakDcCM28d6NP8viB9tGecAlbKw54J5DH70zCqccmyCaIWpTp9MJ9RkTYp2vKNf6Kn7PiYMKKv55Rf1eTo9YIIEXxKWQDNtUPwH-bDHwyxmnF_lprjxhr-r-oSKf5ybrz4xhETDBiLrZafkLiVrcjxttn5YAtjbhx- -sddF8yswNJ1wj835Q6dfRMaz5639GvJiUovdKOUyHo9yFseEtWzvJlyI4qgnykjtUuM6tv7EIEFbqfy6WtUyzzjhOf_UssTvzv56wUlljwzrM-HmhFsHI1_9C6AS2bGhjdXnxj3lO6VnHK3cBzlxU_lvp0STgYX-zcVD-gzll3KhUGHAdYPOeXxkB91aPWCUpgCp781BMTfqpQf8vEGmIxKlNhCnLA4d6gRiZq7-UXBRoEEoFxvUxFNCZ4KN9JQnkKVdyf42P08bvVjAv3AHp-DjiqV__Hylxm2YN6KdEe5r4u5IYjOpW6VxsZvypZGoj5JD9YrQbui-aLx5Gkk7iBMzm62c0W6qH-eg4fGbeQa74ZnK2f3gioWKSjl1DfEhT-A2Q2ZUl8G1eMpVKocrHXyvC4YihOOTZbc83LrsTR6kaDE36VTZpVRxw_GzmhDVnAyKXi7qFV1VIMC4t68O_q4m06y950f_YCAGmetZvAvG1EMOACEa6uhkfMVvYQQVPsjvfDYd9YYit0YE5as6Dffd