<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="531px" preserveAspectRatio="none" style="width:1216px;height:531px;background:#FFFFFF;" version="1.1" viewBox="0 0 1216 531" width="1216px" zoomAndPan="magnify"><title>06 &#183; Rattrapage d&#8217;un fil apr&#232;s une coupure
Bob reprend depuis la derni&#232;re s&#233;quence re&#231;ue.</title><defs/><g><text fill="#10283F" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="309.7295" x="452.425" y="28.5352">06 &#183; Rattrapage d&#8217;un fil apr&#232;s une coupure</text><text fill="#10283F" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="343.6836" x="435.448" y="45.0234">Bob reprend depuis la derni&#232;re s&#233;quence re&#231;ue.</text><g><title>Client React</title><rect fill="#000000" fill-opacity="0.00000" height="434.2793" width="8" x="48.3628" y="90.4648"/><line style="stroke:#8DA6BC;stroke-width:0.5;stroke-dasharray:5,5;" x1="52" x2="52" y1="90.4648" y2="524.7441"/></g><g><title>Diffusion WebSocket v1</title><rect fill="#000000" fill-opacity="0.00000" height="434.2793" width="8" x="487.5195" y="90.4648"/><line style="stroke:#8DA6BC;stroke-width:0.5;stroke-dasharray:5,5;" x1="491.4878" x2="491.4878" y1="90.4648" y2="524.7441"/></g><g><title>Identit. et sessions</title><rect fill="#000000" fill-opacity="0.00000" height="434.2793" width="8" x="865.3896" y="90.4648"/><line style="stroke:#8DA6BC;stroke-width:0.5;stroke-dasharray:5,5;" x1="868.7749" x2="868.7749" y1="90.4648" y2="524.7441"/></g><g><title>Acc.s PostgreSQL</title><rect fill="#000000" fill-opacity="0.00000" height="434.2793" width="8" x="1015.1128" y="90.4648"/><line style="stroke:#8DA6BC;stroke-width:0.5;stroke-dasharray:5,5;" x1="1019.0044" x2="1019.0044" y1="90.4648" y2="524.7441"/></g><g><title>Base et journal</title><rect fill="#000000" fill-opacity="0.00000" height="434.2793" width="8" x="1149.4004" y="90.4648"/><line style="stroke:#8DA6BC;stroke-width:0.5;stroke-dasharray:5,5;" x1="1153.2212" x2="1153.2212" y1="90.4648" y2="524.7441"/></g><g class="participant participant-head" data-participant="p0"><rect fill="#E8F1FA" height="30.4883" rx="2.5" ry="2.5" style="stroke:#38678E;stroke-width:0.5;" width="94.7256" x="5" y="58.9766"/><text fill="#10283F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.7256" x="12" y="79.5117">Client React</text></g><g class="participant participant-head" data-participant="p1"><rect fill="#E8F1FA" height="30.4883" rx="2.5" ry="2.5" style="stroke:#38678E;stroke-width:0.5;" width="174.0635" x="404.4878" y="58.9766"/><text fill="#10283F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.0635" x="411.4878" y="79.5117">Diffusion WebSocket v1</text></g><g class="participant participant-head" data-participant="p2"><rect fill="#E8F1FA" height="30.4883" rx="2.5" ry="2.5" style="stroke:#38678E;stroke-width:0.5;" width="145.2295" x="796.7749" y="58.9766"/><text fill="#10283F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.2295" x="803.7749" y="79.5117">Identit&#233; et sessions</text></g><g class="participant participant-head" data-participant="p3"><rect fill="#E8F1FA" height="30.4883" rx="2.5" ry="2.5" style="stroke:#38678E;stroke-width:0.5;" width="134.2168" x="952.0044" y="58.9766"/><text fill="#10283F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="120.2168" x="959.0044" y="79.5117">Acc&#232;s PostgreSQL</text></g><g class="participant participant-head" data-participant="p4"><rect fill="#E8F1FA" height="30.4883" rx="2.5" ry="2.5" style="stroke:#38678E;stroke-width:0.5;" width="114.3584" x="1096.2212" y="58.9766"/><text fill="#10283F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="100.3584" x="1103.2212" y="79.5117">Base et journal</text></g><g class="message" data-participant-1="p0" data-participant-2="p1"><polygon fill="#37516E" points="479.5195,117.7754,489.5195,121.7754,479.5195,125.7754,483.5195,121.7754" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="52.3628" x2="485.5195" y1="121.7754" y2="121.7754"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="59.3628" y="117.0332">1</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="394.7988" x="71.9385" y="117.0332">Apr&#232;s fermeture, Bob rouvre /api/v1/ws au bout de 1 500 ms.</text></g><g class="message" data-participant-1="p1" data-participant-2="p2"><polygon fill="#37516E" points="857.3896,147.0859,867.3896,151.0859,857.3896,155.0859,861.3896,151.0859" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="491.5195" x2="863.3896" y1="151.0859" y2="151.0859"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="498.5195" y="146.3438">2</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.2944" x="511.0952" y="146.3438">V&#233;rifie l&#8217;origine au handshake et authentifie le cookie.</text></g><g class="message" data-participant-1="p1" data-participant-2="p0"><polygon fill="#37516E" points="63.3628,176.3965,53.3628,180.3965,63.3628,184.3965,59.3628,180.3965" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="57.3628" x2="490.5195" y1="180.3965" y2="180.3965"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="69.3628" y="175.6543">3</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.0156" x="81.9385" y="175.6543">Envoie ready (heartbeatSeconds=30).</text></g><g class="message" data-participant-1="p0" data-participant-2="p1"><polygon fill="#37516E" points="479.5195,221.0176,489.5195,225.0176,479.5195,229.0176,483.5195,225.0176" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="52.3628" x2="485.5195" y1="225.0176" y2="225.0176"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="59.3628" y="212.6201">4</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="385.3853" x="71.9385" y="204.9648">Envoie {v:1, type:subscribe, conversationId, afterSeq} avec un</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.9556" x="71.9385" y="220.2754">curseur d&#233;cimal en cha&#238;ne.</text></g><g class="message" data-participant-1="p1" data-participant-2="p3"><polygon fill="#37516E" points="1007.1128,250.3281,1017.1128,254.3281,1007.1128,258.3281,1011.1128,254.3281" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="491.5195" x2="1013.1128" y1="254.3281" y2="254.3281"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="498.5195" y="249.5859">5</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.3149" x="511.0952" y="249.5859">V&#233;rifie la session et l&#8217;appartenance &#224; la conversation.</text></g><g class="message" data-participant-1="p1" data-participant-2="p4"><polygon fill="#37516E" points="1141.4004,294.9492,1151.4004,298.9492,1141.4004,302.9492,1145.4004,298.9492" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="491.5195" x2="1147.4004" y1="298.9492" y2="298.9492"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="498.5195" y="286.5518">6</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.9517" x="511.0952" y="278.8965">Lit conversations.last_seq pour l&#8217;accus&#233;</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.4399" x="511.0952" y="294.207">subscribed(snapshotSeq).</text></g><g class="message" data-participant-1="p1" data-participant-2="p0"><polygon fill="#37516E" points="63.3628,324.2598,53.3628,328.2598,63.3628,332.2598,59.3628,328.2598" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="57.3628" x2="490.5195" y1="328.2598" y2="328.2598"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="69.3628" y="323.5176">7</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.458" x="81.9385" y="323.5176">Confirme l&#8217;abonnement. Un curseur 0 relit depuis le d&#233;but.</text></g><g class="message" data-participant-1="p1" data-participant-2="p4"><polygon fill="#37516E" points="1141.4004,368.8809,1151.4004,372.8809,1141.4004,376.8809,1145.4004,372.8809" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="491.5195" x2="1147.4004" y1="372.8809" y2="372.8809"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="498.5195" y="360.4834">8</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="415.0859" x="511.0952" y="352.8281">SELECT seq &gt; afterSeq ORDER BY seq LIMIT 100. NOTIFY ou r&#233;veil</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.5161" x="511.0952" y="368.1387">p&#233;riodique &#224; 10 s relance la lecture.</text></g><g class="message" data-participant-1="p1" data-participant-2="p3"><polygon fill="#37516E" points="1007.1128,398.1914,1017.1128,402.1914,1007.1128,406.1914,1011.1128,402.1914" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="491.5195" x2="1013.1128" y1="402.1914" y2="402.1914"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="498.5195" y="397.4492">9</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.3784" x="511.0952" y="397.4492">Revalide les droits avant de livrer chaque &#233;v&#233;nement.</text></g><g class="message" data-participant-1="p1" data-participant-2="p0"><polygon fill="#37516E" points="63.3628,442.8125,53.3628,446.8125,63.3628,450.8125,59.3628,446.8125" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="57.3628" x2="490.5195" y1="446.8125" y2="446.8125"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1514" x="69.3628" y="434.415">10</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.4863" x="90.5142" y="426.7598">event avec seq, at, event, data. React avance son curseur et</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.7412" x="90.5142" y="442.0703">fusionne les messages par ID.</text></g><g class="message" data-participant-1="p1" data-participant-2="p0"><polygon fill="#37516E" points="63.3628,502.7441,53.3628,506.7441,63.3628,510.7441,59.3628,506.7441" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="57.3628" x2="490.5195" y1="506.7441" y2="506.7441"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1514" x="69.3628" y="486.6914">11</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333.5693" x="90.5142" y="471.3809">Acc&#232;s perdu : error NOT_MEMBER. Tampon &gt; 1 Mio :</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="394.0054" x="90.5142" y="486.6914">resync_required(fromSeq). Dans ces deux cas, le serveur retire</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.019" x="90.5142" y="502.002">l&#8217;abonnement.</text></g><!--SRC=[XLJBRjj65DthAowIJG8eCcabZY2W1lG41DX9Ahaj0WWmBibBQIfoXfu77ICeaD_ehhj6cswxB_-aNz8xf29JWO4k10epvpxEEVUEsGbPeCOS8ent6wsSJ2OgKnhkjy9InnplpHOJTI_a1bBCJFiceHHTPkTAsdUO4wnGcXLfaJwDQT8_3uFpGN_UBa1tZcHC7r1R4Oi2fHr_rzFpsM0UpaV_4wHqGleGq1zSl1tCdWYu4Yd_99sW1zFHnNZo17gajRh_blBjc_1YrjcAX21LoaRgKmUTLTBb4UcE5JOZ22xWdxzXYTPgB713aFpxvNSd8HKPOA6hhmQS98YLAvocjHoh23GLccJ2MXLE6CYG_safgg-Qm5JxfXD6LNywwdMAHyRmR989uk-ICBRF00qKmIbWAjBK6Q4a_4BHIiKxib263JGyXIuIJYLijGV6638-oZJ8yrFaA8uzaG_As8scrOzN3Qf_YXgZ8P_gL-MqnAp1lEuK0RowvE9363LwfAHpign65serb2kP-1aMugmCp-uDe8D8ESkgG0XlWW1ompA4TPhp8VnSxNdc1476KYijDkokZzcYJ7XuTtKJRDJMqwjnNd-r4tJC4WnX9aiblCgOFC2BBJ6JYD2kA5QSveT-yBBNQls0_bmEmoxOXuA6naKcrY9Y5XnHaZPeMS15qWLCBUaLtVq6M5BC_gzbxBGXfo6fzh78CGEI46-n-ai-DjLlKyDlZdWodYWMNcoIw6UZ-iCZsdMFMLuFuKhOaplJoz3OMvvnADYR9bqSEvwrjJpoI5uOYONPAjRWxcLRgecIgM3Fci18IKavQzk3dvZ4WLZ0IcR27cUQFDN8sNPVgzdLR7BZTmqkZoB1- -LqjeJnn_hyQd6zk84m27hmxltDOluHb0DTxKiIsLeMNXwL2DuGBq4OWF5bQqbOZunYFrPjGPTKOkONE2C3YLR2ydYLVbpzcU31qzw7Ek6-hFO7PYtoLFg5guta1jbSsstEkf2WnLwpYtLIxiAeHqd8hcMpYxAfdxEZ_4JmLg26nRHTvR1X1Ud40HVbPqXx1MwlPzVZsR87DvWNdFkID-9QA1YkfIRp8EDRpI-NqEnUgbLUEmTJVfSXzeJ9VO8OJTVxOKYNlYrDLlYNw3ip_mC0]--></g></svg>