Bob reprend depuis la derni&#232;re s&#233;quence re&#231;ue.</title><defs/><g><text fill="#10283F" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="273.0889" x="486.28" y="28.5352">Rattrapage d&#8217;un fil apr&#232;s une coupure</text><text fill="#10283F" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="343.6836" x="450.9827" y="45.0234">Bob reprend depuis la derni&#232;re s&#233;quence re&#231;ue.</text><g><title>Client React</title><rect fill="#000000" fill-opacity="0.00000" height="434.2793" width="8" x="48.3628" y="106.9531"/><line style="stroke:#8DA6BC;stroke-width:0.5;stroke-dasharray:5,5;" x1="52" x2="52" y1="106.9531" y2="541.2324"/></g><g><title>Abonnements WebSocket</title><rect fill="#000000" fill-opacity="0.00000" height="434.2793" width="8" x="487.5195" y="106.9531"/><line style="stroke:#8DA6BC;stroke-width:0.5;stroke-dasharray:5,5;" x1="490.6567" x2="490.6567" y1="106.9531" y2="541.2324"/></g><g><title>Identit. et sessions</title><rect fill="#000000" fill-opacity="0.00000" height="434.2793" width="8" x="865.3896" y="106.9531"/><line style="stroke:#8DA6BC;stroke-width:0.5;stroke-dasharray:5,5;" x1="868.7749" x2="868.7749" y1="106.9531" y2="541.2324"/></g><g><title>PostgresRepository</title><rect fill="#000000" fill-opacity="0.00000" height="434.2793" width="8" x="1020.1201" y="106.9531"/><line style="stroke:#8DA6BC;stroke-width:0.5;stroke-dasharray:5,5;" x1="1024.0044" x2="1024.0044" y1="106.9531" y2="541.2324"/></g><g><title>postgres . base et</title><rect fill="#000000" fill-opacity="0.00000" height="434.2793" width="8" x="1169.9424" y="106.9531"/><line style="stroke:#8DA6BC;stroke-width:0.5;stroke-dasharray:5,5;" x1="1173.2358" x2="1173.2358" y1="106.9531" y2="541.2324"/></g><g class="participant participant-head" data-participant="p0"><rect fill="#E8F1FA" height="30.4883" rx="2.5" ry="2.5" style="stroke:#38678E;stroke-width:0.5;" width="94.7256" x="5" y="75.4648"/><text fill="#10283F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.7256" x="12" y="96">Client React</text></g><g class="participant participant-head" data-participant="p1"><rect fill="#E8F1FA" height="30.4883" rx="2.5" ry="2.5" style="stroke:#38678E;stroke-width:0.5;" width="185.7256" x="398.6567" y="75.4648"/><text fill="#10283F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="171.7256" x="405.6567" y="96">Abonnements WebSocket</text></g><g class="participant participant-head" data-participant="p2"><rect fill="#E8F1FA" height="30.4883" rx="2.5" ry="2.5" style="stroke:#38678E;stroke-width:0.5;" width="145.2295" x="796.7749" y="75.4648"/><text fill="#10283F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.2295" x="803.7749" y="96">Identit&#233; et sessions</text></g><g class="participant participant-head" data-participant="p3"><rect fill="#E8F1FA" height="30.4883" rx="2.5" ry="2.5" style="stroke:#38678E;stroke-width:0.5;" width="144.2314" x="952.0044" y="75.4648"/><text fill="#10283F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130.2314" x="959.0044" y="96">PostgresRepository</text></g><g class="participant participant-head" data-participant="p4"><rect fill="#E8F1FA" height="46.9766" rx="2.5" ry="2.5" style="stroke:#38678E;stroke-width:0.5;" width="135.4131" x="1106.2358" y="58.9766"/><text fill="#10283F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="121.4131" x="1113.2358" y="79.5117">postgres &#183; base et</text><text fill="#10283F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="47.7422" x="1150.0713" y="96">journal</text></g><g class="message" data-participant-1="p0" data-participant-2="p1"><polygon fill="#37516E" points="479.5195,134.2637,489.5195,138.2637,479.5195,142.2637,483.5195,138.2637" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="52.3628" x2="485.5195" y1="138.2637" y2="138.2637"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="59.3628" y="133.5215">1</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="394.7988" x="71.9385" y="133.5215">Apr&#232;s fermeture, Bob rouvre /api/v1/ws au bout de 1 500 ms.</text></g><g class="message" data-participant-1="p1" data-participant-2="p2"><polygon fill="#37516E" points="857.3896,163.5742,867.3896,167.5742,857.3896,171.5742,861.3896,167.5742" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="491.5195" x2="863.3896" y1="167.5742" y2="167.5742"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="498.5195" y="162.832">2</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.2944" x="511.0952" y="162.832">V&#233;rifie l&#8217;origine au handshake et authentifie le cookie.</text></g><g class="message" data-participant-1="p1" data-participant-2="p0"><polygon fill="#37516E" points="63.3628,192.8848,53.3628,196.8848,63.3628,200.8848,59.3628,196.8848" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="57.3628" x2="490.5195" y1="196.8848" y2="196.8848"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="69.3628" y="192.1426">3</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.0156" x="81.9385" y="192.1426">Envoie ready (heartbeatSeconds=30).</text></g><g class="message" data-participant-1="p0" data-participant-2="p1"><polygon fill="#37516E" points="479.5195,237.5059,489.5195,241.5059,479.5195,245.5059,483.5195,241.5059" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="52.3628" x2="485.5195" y1="241.5059" y2="241.5059"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="59.3628" y="229.1084">4</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="385.3853" x="71.9385" y="221.4531">Envoie {v:1, type:subscribe, conversationId, afterSeq} avec un</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.9556" x="71.9385" y="236.7637">curseur d&#233;cimal en cha&#238;ne.</text></g><g class="message" data-participant-1="p1" data-participant-2="p3"><polygon fill="#37516E" points="1012.1201,266.8164,1022.1201,270.8164,1012.1201,274.8164,1016.1201,270.8164" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="491.5195" x2="1018.1201" y1="270.8164" y2="270.8164"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="498.5195" y="266.0742">5</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.3149" x="511.0952" y="266.0742">V&#233;rifie la session et l&#8217;appartenance &#224; la conversation.</text></g><g class="message" data-participant-1="p1" data-participant-2="p4"><polygon fill="#37516E" points="1161.9424,311.4375,1171.9424,315.4375,1161.9424,319.4375,1165.9424,315.4375" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="491.5195" x2="1167.9424" y1="315.4375" y2="315.4375"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="498.5195" y="303.04">6</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.9517" x="511.0952" y="295.3848">Lit conversations.last_seq pour l&#8217;accus&#233;</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.4399" x="511.0952" y="310.6953">subscribed(snapshotSeq).</text></g><g class="message" data-participant-1="p1" data-participant-2="p0"><polygon fill="#37516E" points="63.3628,340.748,53.3628,344.748,63.3628,348.748,59.3628,344.748" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="57.3628" x2="490.5195" y1="344.748" y2="344.748"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="69.3628" y="340.0059">7</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.458" x="81.9385" y="340.0059">Confirme l&#8217;abonnement. Un curseur 0 relit depuis le d&#233;but.</text></g><g class="message" data-participant-1="p1" data-participant-2="p4"><polygon fill="#37516E" points="1161.9424,385.3691,1171.9424,389.3691,1161.9424,393.3691,1165.9424,389.3691" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="491.5195" x2="1167.9424" y1="389.3691" y2="389.3691"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="498.5195" y="376.9717">8</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="415.0859" x="511.0952" y="369.3164">SELECT seq &gt; afterSeq ORDER BY seq LIMIT 100. NOTIFY ou r&#233;veil</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.5161" x="511.0952" y="384.627">p&#233;riodique &#224; 10 s relance la lecture.</text></g><g class="message" data-participant-1="p1" data-participant-2="p3"><polygon fill="#37516E" points="1012.1201,414.6797,1022.1201,418.6797,1012.1201,422.6797,1016.1201,418.6797" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="491.5195" x2="1018.1201" y1="418.6797" y2="418.6797"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="498.5195" y="413.9375">9</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.3784" x="511.0952" y="413.9375">Revalide les droits avant de livrer chaque &#233;v&#233;nement.</text></g><g class="message" data-participant-1="p1" data-participant-2="p0"><polygon fill="#37516E" points="63.3628,459.3008,53.3628,463.3008,63.3628,467.3008,59.3628,463.3008" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="57.3628" x2="490.5195" y1="463.3008" y2="463.3008"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1514" x="69.3628" y="450.9033">10</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.4863" x="90.5142" y="443.248">event avec seq, at, event, data. React avance son curseur et</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.7412" x="90.5142" y="458.5586">fusionne les messages par ID.</text></g><g class="message" data-participant-1="p1" data-participant-2="p0"><polygon fill="#37516E" points="63.3628,519.2324,53.3628,523.2324,63.3628,527.2324,59.3628,523.2324" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="57.3628" x2="490.5195" y1="523.2324" y2="523.2324"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1514" x="69.3628" y="503.1797">11</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333.5693" x="90.5142" y="487.8691">Acc&#232;s perdu : error NOT_MEMBER. Tampon &gt; 1 Mio :</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="394.0054" x="90.5142" y="503.1797">resync_required(fromSeq). Dans ces deux cas, le serveur retire</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.019" x="90.5142" y="518.4902">l&#8217;abonnement.</text></g><!--SRC=[XLJDRjj64BxhAGR99G5KcRGIHn1G0v8i0GBi993S5W446CFbKDgAtANtXuvH5EXhzDPReqkllPTlqYVfhAZ8L62W1q4I-StiV3-pTYjLYGOBI51irqPxbKvqhWqyRAIZZZs-jnjCzODKQyWmj-qtAMNeSpVJoht7Wc29oYx9oEnvJDF-PHoT3_gpzW5qxqa9-eZ6II5BL6xypKmlfuDPF1lzJv4sAPb3GNzmyMumVQRWMcRyKNI27boDBiQJPz0ZO_J3rvRltiONqyv6fWIPrYxHdpledLQ-ICXqd7GvmGATCrZYcY3zzxVVlO9Cve2bgRzOy8f0Q5zwGoirrWaOAWsfb5KglRIG8_yoIjPV386jTyqCZAh_zDJhb4zSuSKabyJV2qBXNW1QAADJm2ZHIb7180i_KRBKOai7P7oAdASCagxU0JbcRgtKoZR8yrFaHstTsf1TKAcjTDeyDh3-AQmymE2VlpbUbhZlIlsilL6ODmLlEcK4trtoA4CODU9aP0foB4qNzj9eNx4APrZAioe-Ux207XBj7Ki4CRoD8YWiQnBlsvmFuSTwnz6J13dhherSiycXPeCgvGnlmnJytsq2sJqkcA6taevTeY5CLQLba1pJHtYr8QQL4Beb2Srjlkz7htkjqG_eNwfXt0NtMDBG-iGA8nDcmHKL6OkEvPodNS3CaLdI_Q-05GaEmqe9Ronv0scz4xB074Y1s63zbteQgj-cXb_z2MG2KIo3ygGm1AN-8o3Qvnwxl1d2jNGdxsmlH-lkEEfGiZTDEo4y1s-bZZpILrPXQJUQDRX_tPPgebKcsREcy9Ys7lp090x48bOob-uOS0fK4-_QSosdrzF9RLWvk3oA11yMLzC5Z3_jdr_FR-Qt44TH3zv_k9tFFe7sOEfTHJ9VgJB8erF9wn8aY2EmuTYz9An7JYB4gYteWYhCmnxd7DBKQCaxWbN8RdWcENWc-B1lkAlgtO5PYpnLOVlsHlA0RAxhDi-waAB3NhEO-wOyXTLFaeHTo7pmK3Nd5-metnUy5MXWVjK-PIH4M8sIJEg13-NRo0G5xcwcD-FfeWUtM9JS-v8tuaPg6AuKhzsZ4dU6Bp1fsBtCw6Bl75pnzGmY42R_6GJQRl33agd2M8QS3DVIDsR-1m00]--></g></svg>