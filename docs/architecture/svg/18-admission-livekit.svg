<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="578px" preserveAspectRatio="none" style="width:1112px;height:578px;background:#FFFFFF;" version="1.1" viewBox="0 0 1112 578" width="1112px" zoomAndPan="magnify"><title>18 &#183; Admission LiveKit exp&#233;rimentale
S&#233;quence exerc&#233;e par tests HTTP, avec une base et sans serveur SFU.</title><defs/><g><text fill="#10283F" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="273.9775" x="418.0237" y="28.5352">18 &#183; Admission LiveKit exp&#233;rimentale</text><text fill="#10283F" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="498.8184" x="305.6033" y="45.0234">S&#233;quence exerc&#233;e par tests HTTP, avec une base et sans serveur SFU.</text><g><title>Client de test v1</title><rect fill="#000000" fill-opacity="0.00000" height="481.5215" width="8" x="63.4565" y="90.4648"/><line style="stroke:#8DA6BC;stroke-width:0.5;stroke-dasharray:5,5;" x1="67" x2="67" y1="90.4648" y2="571.9863"/></g><g><title>Admission d.appel</title><rect fill="#000000" fill-opacity="0.00000" height="481.5215" width="8" x="491.9238" y="90.4648"/><line style="stroke:#8DA6BC;stroke-width:0.5;stroke-dasharray:5,5;" x1="495.8896" x2="495.8896" y1="90.4648" y2="571.9863"/></g><g><title>Identit. et sessions</title><rect fill="#000000" fill-opacity="0.00000" height="481.5215" width="8" x="885.1934" y="90.4648"/><line style="stroke:#8DA6BC;stroke-width:0.5;stroke-dasharray:5,5;" x1="888.5786" x2="888.5786" y1="90.4648" y2="571.9863"/></g><g><title>Acc.s PostgreSQL</title><rect fill="#000000" fill-opacity="0.00000" height="481.5215" width="8" x="1034.9165" y="90.4648"/><line style="stroke:#8DA6BC;stroke-width:0.5;stroke-dasharray:5,5;" x1="1038.8081" x2="1038.8081" y1="90.4648" y2="571.9863"/></g><g class="participant participant-head" data-participant="p0"><rect fill="#E8F1FA" height="30.4883" rx="2.5" ry="2.5" style="stroke:#38678E;stroke-width:0.5;" width="124.9131" x="5" y="58.9766"/><text fill="#10283F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="110.9131" x="12" y="79.5117">Client de test v1</text></g><g class="participant participant-head" data-participant="p1"><rect fill="#E8F1FA" height="30.4883" rx="2.5" ry="2.5" style="stroke:#38678E;stroke-width:0.5;" width="140.0684" x="425.8896" y="58.9766"/><text fill="#10283F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.0684" x="432.8896" y="79.5117">Admission d&#8217;appel</text></g><g class="participant participant-head" data-participant="p2"><rect fill="#E8F1FA" height="30.4883" rx="2.5" ry="2.5" style="stroke:#38678E;stroke-width:0.5;" width="145.2295" x="816.5786" y="58.9766"/><text fill="#10283F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.2295" x="823.5786" y="79.5117">Identit&#233; et sessions</text></g><g class="participant participant-head" data-participant="p3"><rect fill="#E8F1FA" height="30.4883" rx="2.5" ry="2.5" style="stroke:#38678E;stroke-width:0.5;" width="134.2168" x="971.8081" y="58.9766"/><text fill="#10283F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="120.2168" x="978.8081" y="79.5117">Acc&#232;s PostgreSQL</text></g><g class="message" data-participant-1="p0" data-participant-2="p1"><polygon fill="#37516E" points="483.9238,133.0859,493.9238,137.0859,483.9238,141.0859,487.9238,137.0859" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="67.4565" x2="489.9238" y1="137.0859" y2="137.0859"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="74.4565" y="124.6885">1</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.875" x="87.0322" y="117.0332">POST /api/v1/conversations/{id}/calls {clientId,mode}.</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.2783" x="87.0322" y="132.3438">CHATISEN_EXPERIMENTAL_CALLS doit valoir true, sinon 503.</text></g><g class="message" data-participant-1="p1" data-participant-2="p2"><polygon fill="#37516E" points="877.1934,162.3965,887.1934,166.3965,877.1934,170.3965,881.1934,166.3965" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="495.9238" x2="883.1934" y1="166.3965" y2="166.3965"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="502.9238" y="161.6543">2</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="356.6938" x="515.4995" y="161.6543">Chaque mutation v&#233;rifie session, Origin et x-csrf-token.</text></g><g class="message" data-participant-1="p1" data-participant-2="p3"><polygon fill="#37516E" points="1026.9165,222.3281,1036.9165,226.3281,1026.9165,230.3281,1030.9165,226.3281" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="495.9238" x2="1032.9165" y1="226.3281" y2="226.3281"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="502.9238" y="206.2754">3</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.3452" x="515.4995" y="190.9648">Verrouille conversation puis membre. Ins&#232;re calls,</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="422.957" x="515.4995" y="206.2754">state=ringing, room_name=chatisen_&lt;UUID appel&gt;. Un seul appel</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.522" x="515.4995" y="221.5859">ouvert par fil.</text></g><g class="message" data-participant-1="p1" data-participant-2="p0"><polygon fill="#37516E" points="78.4565,266.9492,68.4565,270.9492,78.4565,274.9492,74.4565,270.9492" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="72.4565" x2="494.9238" y1="270.9492" y2="270.9492"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="84.4565" y="258.5518">4</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.124" x="97.0322" y="250.8965">Cr&#233;ation 201, retry identique 200, conflit 409. Aucun</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.4448" x="97.0322" y="266.207">&#233;v&#233;nement d&#8217;invitation v1.</text></g><g class="message" data-participant-1="p0" data-participant-2="p1"><polygon fill="#37516E" points="483.9238,311.5703,493.9238,315.5703,483.9238,319.5703,487.9238,315.5703" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="67.4565" x2="489.9238" y1="315.5703" y2="315.5703"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="74.4565" y="303.1729">5</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="377.5269" x="87.0322" y="295.5176">POST /api/v1/calls/{id}/join. LIVEKIT_URL doit d&#233;signer une</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="279.7031" x="87.0322" y="310.8281">URL wss et les cl&#233;s doivent &#234;tre configur&#233;es.</text></g><g class="message" data-participant-1="p1" data-participant-2="p3"><polygon fill="#37516E" points="1026.9165,356.1914,1036.9165,360.1914,1026.9165,364.1914,1030.9165,360.1914" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="495.9238" x2="1032.9165" y1="360.1914" y2="360.1914"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="502.9238" y="347.7939">6</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="365.5361" x="515.4995" y="340.1387">Verrouille conversation, membre, session et appel. Upsert</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.9839" x="515.4995" y="355.4492">call_participants, &#233;tat invited. Identit&#233; = userId_sessionId.</text></g><g class="message" data-participant-1="p1" data-participant-2="p0"><polygon fill="#37516E" points="78.4565,416.123,68.4565,420.123,78.4565,424.123,74.4565,420.123" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="72.4565" x2="494.9238" y1="420.123" y2="420.123"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="84.4565" y="400.0703">7</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.21" x="97.0322" y="384.7598">200 {callId,serverUrl,token,expiresAt}, Cache-Control</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.3467" x="97.0322" y="400.0703">no-store. JWT HS256, salle unique, roomJoin, canPublish et</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87.0581" x="97.0322" y="415.3809">canSubscribe.</text></g><g class="message" data-participant-1="p0" data-participant-2="p1"><polygon fill="#37516E" points="483.9238,460.7441,493.9238,464.7441,483.9238,468.7441,487.9238,464.7441" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="67.4565" x2="489.9238" y1="464.7441" y2="464.7441"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="74.4565" y="452.3467">8</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="391.8916" x="87.0322" y="444.6914">POST /api/v1/calls/{id}/end par initiateur ou owner. 403 pour</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="113.4072" x="87.0322" y="460.002">un autre membre.</text></g><g class="message" data-participant-1="p1" data-participant-2="p3"><polygon fill="#37516E" points="1026.9165,505.3652,1036.9165,509.3652,1026.9165,513.3652,1030.9165,509.3652" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="495.9238" x2="1032.9165" y1="509.3652" y2="509.3652"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="502.9238" y="496.9678">9</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.5449" x="515.4995" y="489.3125">&#201;crit state=ended et ended_at. Une admission ult&#233;rieure</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.8423" x="515.4995" y="504.623">renvoie 409 CALL_ENDED.</text></g><g class="message" data-participant-1="p1" data-participant-2="p0"><polygon fill="#37516E" points="78.4565,549.9863,68.4565,553.9863,78.4565,557.9863,74.4565,553.9863" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="72.4565" x2="494.9238" y1="553.9863" y2="553.9863"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1514" x="84.4565" y="541.5889">10</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="357.7856" x="105.6079" y="533.9336">204. Le JWT d&#233;j&#224; &#233;mis expire au plus t&#244;t entre +300 s et</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382.4019" x="105.6079" y="549.2441">l&#8217;expiration de session. La d&#233;connexion SFU reste &#224; int&#233;grer.</text></g><!--SRC=[ZLJTRXf75BxdAOwIoowOdzYXLXs9O919g4C3fBr0GiFk0IRUFREPdxMho59l-mYzwsNeTQNUTz-aJz8pipR1aQj6mX9updpdV3zdp9MaN6YHmKh4Lnkj72LzbIeDrrjfiMRsvsOh4dKjQGDhaPh3amJNmgLsgCXUYWnXAiXCKSlrupKL_DDMiztj30yRu0U75ED4Q2jZcGkoBx-OwUcWEsmDU_zpIUa4zTs5JlVaU