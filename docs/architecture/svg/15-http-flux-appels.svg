<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="597px" preserveAspectRatio="none" style="width:914px;height:597px;background:#FFFFFF;" version="1.1" viewBox="0 0 914 597" width="914px" zoomAndPan="magnify"><title>Contrat v1 &#8212; messages, &#233;v&#233;nements et appels</title><defs/><g><g class="title" data-source-line="25"><text fill="#17334D" font-family="sans-serif" font-size="21" font-weight="bold" lengthAdjust="spacing" textLength="503.9077" x="201.2332" y="35.3027">Contrat v1 &#8212; messages, &#233;v&#233;nements et appels</text></g><g class="legend" data-source-line="26"><rect fill="#F4F8FB" height="499.7188" rx="4" ry="4" style="stroke:#AABCCA;stroke-width:1;" width="882.374" x="12" y="77.7324"/><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="93.2148" x="22" y="101.2676">Base /api/v1</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="521.0762" x="137.3633" y="101.2676">S = session valide. M = S + Origin exact + x-csrf-token. Fil = membre actif.</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="62.2002" x="31.6143" y="124.7559">M&#233;thode</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="54.6943" x="113.043" y="124.7559">Chemin</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="111.46" x="336.2422" y="124.7559">Garde et entr&#233;e</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="48.2139" x="574.5693" y="124.7559">Succ&#232;s</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="26.5576" x="31.4297" y="151.2441">GET</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="204.3398" x="112.8584" y="151.2441">/conversations/{id}/messages</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.2119" x="336.0576" y="151.2441">S + fil &#183; ?beforeSeq&amp;limit</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="255.7598" x="574.3848" y="151.2441">200 {items: Message[],nextBeforeSeq}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="35.0068" x="31.4297" y="177.7324">POST</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="204.3398" x="112.8584" y="177.7324">/conversations/{id}/messages</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="148.8047" x="336.0576" y="177.7324">M + fil &#183; {clientId,text}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="263.5801" x="574.3848" y="177.7324">201 Message, 200 r&#233;p&#233;tition identique</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="26.5576" x="31.4297" y="204.2207">GET</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="181.7061" x="112.8584" y="204.2207">/conversations/{id}/events</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.9688" x="336.0576" y="204.2207">S + fil &#183; ?afterSeq&amp;limit</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="286.542" x="574.3848" y="204.2207">200 {items: Event[],nextAfterSeq,hasMore}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="26.5576" x="31.4297" y="230.709">GET</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="25.2656" x="112.8584" y="230.709">/ws</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="187.8994" x="336.0576" y="230.709">S + Origin exact + Upgrade</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.916" x="574.3848" y="230.709">101, puis ready</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="35.0068" x="31.4297" y="257.1973">POST</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="167.9316" x="112.8584" y="257.1973">/conversations/{id}/calls</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.2275" x="336.0576" y="257.1973">M + fil &#183; {clientId,mode}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="244.3164" x="574.3848" y="257.1973">201 Appel, 200 r&#233;p&#233;tition identique</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="35.0068" x="31.4297" y="283.6855">POST</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="99.7158" x="112.8584" y="283.6855">/calls/{id}/join</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.4678" x="336.0576" y="283.6855">M + fil &#183; session et appel valides</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="253.4492" x="574.3848" y="283.6855">200 {callId,serverUrl,token,expiresAt}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="35.0068" x="31.4297" y="310.1738">POST</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="99.4219" x="112.8584" y="310.1738">/calls/{id}/end</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="187.5781" x="336.0576" y="310.1738">M + fil &#183; initiateur ou owner</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="26.5576" x="574.3848" y="310.1738">204</text><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="870.3564" y1="106.2207" y2="106.2207"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="870.3564" y1="132.709" y2="132.709"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="870.3564" y1="159.1973" y2="159.1973"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="870.3564" y1="185.6855" y2="185.6855"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="870.3564" y1="212.1738" y2="212.1738"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="870.3564" y1="238.6621" y2="238.6621"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="870.3564" y1="265.1504" y2="265.1504"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="870.3564" y1="291.6387" y2="291.6387"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="870.3564" y1="318.127" y2="318.127"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="22" y1="106.2207" y2="318.127"/><line style="stroke:#17334D;stroke-width:1;" x1="103.4287" x2="103.4287" y1="106.2207" y2="318.127"/><line style="stroke:#17334D;stroke-width:1;" x1="326.6279" x2="326.6279" y1="106.2207" y2="318.127"/><line style="stroke:#17334D;stroke-width:1;" x1="564.9551" x2="564.9551" y1="106.2207" y2="318.127"/><line style="stroke:#17334D;stroke-width:1;" x1="870.3564" x2="870.3564" y1="106.2207" y2="318.127"/><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="22" y="333.6621">&#160;</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="76.3916" x="22" y="350.1504">Pagination</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="555.9668" x="111.6807" y="350.1504">limit de 1 &#224; 100, d&#233;faut 50. beforeSeq exclusif, page renvoy&#233;e en ordre croissant.</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="624.1621" x="22" y="366.6387">nextBeforeSeq = premi&#232;re seq si la page est pleine, sinon null. afterSeq exclusif, d&#233;faut "0".</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="643.5898" x="22" y="383.127">nextAfterSeq = derni&#232;re seq livr&#233;e ou null. hasMore est calcul&#233; avec une ligne suppl&#233;mentaire.</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="62.4121" x="22" y="399.6152">Message</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="715.2305" x="97.7012" y="399.6152">{id,conversationId,seq,senderId,clientId,createdAt,text}. UUID client, 1-4 000 caract&#232;res, texte non blanc.</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="39.7852" x="22" y="416.1035">Event</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="595.9707" x="75.0742" y="416.1035">{v:1,type:"event",conversationId,seq,at,event,data}. Pour message.created, data contient</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="733.0176" x="22" y="432.5918">id, conversationId, senderId, clientId et text. Les curseurs sont des cha&#238;nes d&#233;cimales non n&#233;gatives (int64).</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="41.6172" x="22" y="449.0801">Appel</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="665.0342" x="76.9063" y="449.0801">{id,conversationId,initiatorId,mode,state,roomName,createdAt,endedAt?}. mode = audio ou video.</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="756.3623" x="22" y="465.5684">Le drapeau CHATISEN_EXPERIMENTAL_CALLS vaut false par d&#233;faut. Les trois POST d&#8217;appel r&#233;pondent alors 503.</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="22" y="482.0566">&#160;</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="118.0156" x="22" y="498.5449">WebSocket JSON</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="731.0693" x="153.3047" y="498.5449">Client &#8594; subscribe(conversationId,afterSeq) / unsubscribe(conversationId) / ping / ack(conversationId,seq).</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="760.3545" x="22" y="515.0332">Serveur &#8594; ready(heartbeatSeconds:30) / subscribed(conversationId,snapshotSeq) / event / pong / error(error) /</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="791.2598" x="22" y="531.5215">resync_required(conversationId,fromSeq). Toutes les trames portent v:1 et type. ack valide est accept&#233; sans &#233;criture.</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="760.4297" x="22" y="548.0098">&gt; 4 096 octets entrants &#8594; error BAD_REQUEST. Tampon sortant &gt; 1 Mio &#8594; resync_required et d&#233;sabonnement.</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="710.917" x="22" y="564.498">React traite event et reprend sur fermeture. Le traitement client de resync_required et error reste ouvert.</text></g><!--SRC=[ZLR9RXj74BthAm