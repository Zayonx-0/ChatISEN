<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="793px" preserveAspectRatio="none" style="width:1102px;height:793px;background:#FFFFFF;" version="1.1" viewBox="0 0 1102 793" width="1102px" zoomAndPan="magnify"><title>Les interfaces /api non versionn&#233;es</title><defs/><g><g class="title" data-source-line="25"><text fill="#17334D" font-family="sans-serif" font-size="21" font-weight="bold" lengthAdjust="spacing" textLength="387.9155" x="353.4817" y="35.3027">Les interfaces /api non versionn&#233;es</text></g><g class="legend" data-source-line="26"><rect fill="#F4F8FB" height="695.6719" rx="4" ry="4" style="stroke:#AABCCA;stroke-width:1;" width="1070.8789" x="12" y="77.7324"/><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="147.8066" x="31.6143" y="108.2676">Route relative &#224; /api</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="243.708" x="343.6807" y="108.2676">Serveur standalone &#183; fichier JSON</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="242.4639" x="754.0547" y="108.2676">Fastify historique &#183; Maps en RAM</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="237.7061" x="31.4297" y="134.7559">POST /auth/register et /auth/login</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="243.9746" x="343.4961" y="134.7559">200 {user,csrf}, scrypt, session 24 h</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="293.2207" x="753.8701" y="134.7559">201 inscription / 200 connexion, Argon2id</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="238.54" x="31.4297" y="161.2441">GET /auth/me &#183; POST /auth/logout</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.0439" x="343.4961" y="161.2441">{user,csrf} / {ok:true}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.0439" x="753.8701" y="161.2441">{user,csrf} / {ok:true}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="166.2637" x="31.4297" y="187.7324">GET /users/search?q=&#8230;</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="295.1348" x="343.4961" y="187.7324">Sous-cha&#238;ne du handle ou du nom, 20 max</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.1152" x="753.8701" y="187.7324">M&#234;me recherche, 20 max</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.1387" x="31.4297" y="214.2207">GET /conversations</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="309.5791" x="343.4961" y="214.2207">{conversations} avec membres et lastMessage</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="309.5791" x="753.8701" y="214.2207">{conversations} avec membres et lastMessage</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="140.5879" x="31.4297" y="240.709">POST /conversations</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="313.2979" x="343.4961" y="240.709">{type,memberIds,title?}. Direct existant &#8594; 200</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="292.3457" x="753.8701" y="240.709">Cr&#233;e aussi groupes et directs, r&#233;ponse 201</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="235.3271" x="31.4297" y="267.1973">GET /conversations/{id}/messages</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="275.5977" x="343.4961" y="267.1973">{messages}, derniers limit (50, max 100)</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="262.4111" x="753.8701" y="267.1973">{messages,nextBefore}, accepte before</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="243.7764" x="31.4297" y="293.6855">POST /conversations/{id}/messages</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="256.9766" x="343.4961" y="293.6855">{text,clientMessageId}, 201 {message}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="287.3555" x="753.8701" y="293.6855">M&#234;me nom de cl&#233;, r&#233;ponse 201 {message}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="293.207" x="31.4297" y="320.1738">DELETE /conversations/{id}/members/{uid}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.4307" x="343.4961" y="320.1738">owner &#183; &#233;crit leftAt</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="195.1045" x="753.8701" y="320.1738">owner &#183; &#233;crit leftAt et diffuse</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="240.6523" x="31.4297" y="346.6621">POST /conversations/{id}/members</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.8105" x="343.4961" y="346.6621">Route absente</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="208.2432" x="753.8701" y="346.6621">{userId} &#183; owner &#183; 200 {ok:true}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="121.3789" x="31.4297" y="373.1504">GET /push/config</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="308.4854" x="343.4961" y="373.1504">Session &#8594; disponibilit&#233; et cl&#233; VAPID publique</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.8105" x="753.8701" y="373.1504">Route absente</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="241.541" x="31.4297" y="399.6387">POST /push/subscriptions &#183; DELETE</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="286.5625" x="343.4961" y="399.6387">Ajoute ou retire pour la session avec CSRF</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.8105" x="753.8701" y="399.6387">Route absente</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="152.373" x="31.4297" y="426.127">GET /ws avec Upgrade</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="344.5586" x="343.4961" y="426.127">{subscribe:"conversation:"+id}, tous les fils connus</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="305.0332" x="753.8701" y="426.127">M&#234;me trame d&#8217;abonnement, m&#233;moire Fastify</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="212.7891" x="31.4297" y="452.6152">GET /events?conversationId=&#8230;</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="300.3232" x="343.4961" y="452.6152">SSE par conversation &#183; utilisateur et membre</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.8105" x="753.8701" y="452.6152">Route absente</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="207.3682" x="31.4297" y="479.1035">POST /conversations/{id}/calls</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="218.4834" x="343.4961" y="479.1035">{kind} direct &#224; deux &#8594; 201 {call}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="292.5645" x="753.8701" y="479.1035">{kind} &#8594; 201 {call,token} de d&#233;monstration</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="138.8447" x="31.4297" y="505.5918">GET /calls/incoming</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="229.4277" x="343.4961" y="505.5918">{calls} en sonnerie du destinataire</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.8105" x="753.8701" y="505.5918">Route absente</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="260.7979" x="31.4297" y="532.0801">POST /calls/{id}/answer &#183; POST &#8230;/end</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="262.4863" x="343.4961" y="532.0801">{action:accept ou decline} / fin &#8594; {call}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="189.752" x="753.8701" y="532.0801">{call,token} / fin &#8594; {ok:true}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.9385" x="31.4297" y="558.5684">POST /calls/{id}/signal</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="308.875" x="343.4961" y="558.5684">{type:offer ou answer ou ice,data} &#8594; {ok:true}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.8105" x="753.8701" y="558.5684">Route absente</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.6162" x="31.4297" y="585.0566">GET /calls/{id}/token</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.8105" x="343.4961" y="585.0566">Route absente</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="289.6592" x="753.8701" y="585.0566">{token,roomName,serverUrl}, jeton demo.*</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="260.9619" x="31.4297" y="611.5449">POST /conversations/{id}/attachments</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.8105" x="343.4961" y="611.5449">Route absente</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="301.7656" x="753.8701" y="611.5449">Multipart, un fichier &#8804; 5 Mio, stock&#233; en RAM</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151.3613" x="31.4297" y="638.0332">GET /attachments/{id}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="391.5146" x="343.4961" y="638.0332">Donn&#233;es base64 pr&#233;existantes, contr&#244;le par conversation</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="264.8174" x="753.8701" y="638.0332">Buffer du fichier, contr&#244;le par message</text><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="1072.8789" y1="89.7324" y2="89.7324"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="1072.8789" y1="116.2207" y2="116.2207"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="1072.8789" y1="1