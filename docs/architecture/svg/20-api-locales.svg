34.0664" x2="334.0664" y1="89.7324" y2="645.9863"/><line style="stroke:#17334D;stroke-width:1;" x1="744.4404" x2="744.4404" y1="89.7324" y2="645.9863"/><line style="stroke:#17334D;stroke-width:1;" x1="1072.8789" x2="1072.8789" y1="89.7324" y2="645.9863"/><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="22" y="661.5215">&#160;</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="148.6201" x="22" y="678.0098">Stockage standalone</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="696.0557" x="183.9092" y="678.0098">users[], sessions[], conversations[], members[], messages[], calls[], attachments[], pushSubscriptions[].</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="791.3145" x="22" y="694.498">Conversation porte pair (UUID tri&#233;s) et lastSeq num&#233;rique. Message porte conversationId, senderId, clientMessageId.</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="681.543" x="22" y="710.9863">Call porte initiatorId, recipientId et leurs IDs de session. publicCall retire ces IDs de session du DTO.</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="816.1699" x="22" y="727.4746">Cookie local chatisen en HTTP, __Host-chatisen avec COOKIE_SECURE=true. Les erreurs utilisent {error:{code,message}}.</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="739.3066" x="22" y="743.9629">Chat v1, standalone et historique ont des identit&#233;s et des magasins ind&#233;pendants. Les identifiants clientId et</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="735.417" x="22" y="760.4512">clientMessageId appartiennent &#224; des contrats distincts. Les routes v1 figurent dans les deux planches HTTP.</text></g><!--SRC=[bLRBRXit5DtxAuXaaxGJotBa9_A0P4kDsZWsBBkR80Ye6Ox4UeQSa1mxhYqWgmBTTjTT5qK1Tz5LWUwhF_6Nz5pEI1uzdA0BmnhUo_iuFFTXpwJAkE4fw_FmR61qhg8zdMZ3BeRIYHKxbTiXZ_I5L0CMyyHM9P68UPwuZbRk3Ky5wt5bUyB8UBbEJ_ueM7rZkR3m_R2-zVHfOx-YugHBnFJsUdsPwBwxJMFqHIbiR6msjXQ4bTlhMusTpVeoXIBkHaNaqGgrKSAmxSfvngE8WAhc-5eCX8fQSo0_x3GwsvtMefusaJ2bJhFPsjjhLdJUQ2SMBNKwZVtMlDQCdTRsMcDpJgEIUcFxwMQzwiUA3xbGeJZYnibGPbov1RVjpSvwvqkNgb4qThPsTfPTU2rZ_AdPc7VgpVrMfw8TwZJJIk0vt6KYc16XusgGLFaO9jpQfdD6zdCdkg5M_kdMLeOo4aoacRjagN137TcL5SyUe6wPL4wOc8VuMUEPP4ehTYwCbLgfyOsmAub_cXN6hf-pOmtJy9vm9yy56_zMt844p3yNkM4MSKKyGQpittzOBCEX14s-xHs-8QqEjqx6bsmehTD60W7IEk2PPKAnu-O1koP7xEYmTmBJkHlMZ1X06JQ4AqyIFP0AIkjhQ-mgjy84eJNnA60sD9UPmtzXANostc13hrT7bX3ApD5npTy4Fafyn7S0hW-qMfTHwVoRziHtwiEh10FNG00w5R-mTwNFTft9nUXpaZlRf65hLd0J3bz-U7xxwGz8UZgtJy8X7_y5wAAS3O4ZdaZdzA5q6Y1gblAFK3qO_vbw3Wm5B8WxoPqBP4UFo2bXIr7D78mOFnSXs93s3TuTo88xxW2myO7ulzgL1rlmwYup4T15ORgH3JphNevMsRua1ZFWJtnnxFQdN_oZNBCz0z8ndkC56LLSLdYC_0KRC8XH25RuLxqluTgLZ4PuFH-X3sJo6on1bIbmqh94fjAnHnjhWKUllhRskAeQW1wk9M9j16xnC1GPkD_t1_TdlUZQmKmG9XB5MsBMZKQ1Zt_YQpHzL3mq0aGjZs_cSgteUj_xxTVja_OztWbmVEJuWgg-e5OD9ezlK0HuFX6xfhjVuF6EOz3qotbwJr0fEWFlMwGf9cM0HCdwr8sls6KLaULsIFPZEQ1IAEkNM1592mnaNoRIZMyeDCA6VTyywkwpBEydleai-A-4xMtRl3zj09P2AU6xPiqV_4tKcH4EB6EPHXjB-BIBUFBlzOuxztZn2LpOGkyq6nWUUG1Abtsn-w2AtEw3hoMzlqEz0t2B7fbOturoEwM1CxHHHBUVVkLzwbCf_86buvjKKuYJDbe9G9n3nRwiUkf6azRIQsCu6rOL4WQv0whufBuDO8i2_ooMIoWGyYJnFCSWmdCNXKgJ8HBvnxAmmLvI6zsfpPm7Jfy9DIBYHvIYiiZV1rajSF9JamgJa9QCw-8gcXC6XoMCZFHzCnB0Hd77vPToyGPz3jZSBWg6UX5Ggs7aaGyU-ZShgjytOu5ILe9wUomBYjxbLasc8fzZ_89xAmUA9vD-kQlZ6C70LnaMVibG115o6iqRl9-H5Vi-ecKrwWM1qJgb3JQmDCFDgKb0pn-40_wHIFNgLr-Y07UEXqFYwB9ES80T5_kG0O5pDTq8Rd_-dMsm0wanhfqEpwYsgnj0COJl37jFrFRAjGIBknMR3PRHl2Z727esSToPyT-Od0kClsQjt4CBbfHXpEkdqw6689xrN_GeD3guMskUrVel66D-XhzzDrqs_EyPREYWx8_5ps8aU3rw6_fHIP0-gLNrgftgxRjL1B9NpIBJnb6mqh17fwTeWbZunZVsyMGkzyG7fdAq2hzUhRB9d2xkpVO7Ybv5rASHq-o4yduHPdbFAkaanyv6ggXmcP5sD_9UqJyiw-vRAk0IZjMYDuVUHDb