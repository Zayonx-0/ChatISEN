/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="337.4219" x="496.3945" y="374.5293">WS call.invitation. Repli : GET /api/calls/incoming</text><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="329.9365" x="496.3945" y="391.0176">au chargement et &#224; l&#8217;actualisation toutes les 3 s.</text></g><path d="M14,415.9707 L84.7754,415.9707 L84.7754,435.6367 L74.7754,445.6367 L10,445.6367 L10,419.9707 A4,4 0 0 1 14,415.9707" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="803.6309" rx="4" ry="4" style="stroke:#000000;stroke-width:1.5;" width="1146.7295" x="10" y="415.9707"/><text fill="#17334D" font-family="sans-serif" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="19.7754" x="30" y="436.4727">alt</text><text fill="#17334D" font-family="sans-serif" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="93.9771" x="104.7754" y="437.4727">[Bob refuse]</text><g class="message" data-participant-1="bob" data-participant-2="node"><polygon fill="#45647D" points="495.3945,486.791,485.3945,490.791,495.3945,494.791,491.3945,490.791" style="stroke:#45647D;stroke-width:1;"/><line style="stroke:#45647D;stroke-width:1;" x1="489.3945" x2="891.1494" y1="490.791" y2="490.791"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="307.624" x="506.3945" y="480.8379">POST /api/calls/{id}/answer {action:"decline"}</text></g><g class="message" data-participant-1="node" data-participant-2="alice"><polygon fill="#45647D" points="65.0605,527.2793,55.0605,531.2793,65.0605,535.2793,61.0605,531.2793" style="stroke:#45647D;stroke-width:1;"/><line style="stroke:#45647D;stroke-width:1;stroke-dasharray:2,2;" x1="59.0605" x2="483.3945" y1="531.2793" y2="531.2793"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.8936" x="76.0605" y="521.3262">call.updated &#183; ended / declined</text></g><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="10" x2="1156.7295" y1="540.2793" y2="540.2793"/><text fill="#17334D" font-family="sans-serif" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="103.4106" x="20" y="559.7813">[Bob accepte]</text><g class="message" data-participant-1="bob" data-participant-2="bob"><line style="stroke:#45647D;stroke-width:1;" x1="892.1494" x2="934.1494" y1="601.4336" y2="601.4336"/><line style="stroke:#45647D;stroke-width:1;" x1="934.1494" x2="934.1494" y1="601.4336" y2="614.4336"/><line style="stroke:#45647D;stroke-width:1;" x1="893.1494" x2="934.1494" y1="614.4336" y2="614.4336"/><polygon fill="#45647D" points="903.1494,610.4336,893.1494,614.4336,903.1494,618.4336,899.1494,614.4336" style="stroke:#45647D;stroke-width:1;"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="235.5801" x="904.1494" y="591.4805">Obtient micro et, en vid&#233;o, cam&#233;ra</text></g><g class="message" data-participant-1="bob" data-participant-2="node"><polygon fill="#45647D" points="495.3945,650.9219,485.3945,654.9219,495.3945,658.9219,491.3945,654.9219" style="stroke:#45647D;stroke-width:1;"/><line style="stroke:#45647D;stroke-width:1;" x1="489.3945" x2="891.1494" y1="654.9219" y2="654.9219"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="303.1807" x="506.3945" y="644.9688">POST /api/calls/{id}/answer {action:"accept"}</text></g><g class="message" data-participant-1="node" data-participant-2="node"><line style="stroke:#45647D;stroke-width:1;" x1="484.3945" x2="526.3945" y1="695.4102" y2="695.4102"/><line style="stroke:#45647D;stroke-width:1;" x1="526.3945" x2="526.3945" y1="695.4102" y2="708.4102"/><line style="stroke:#45647D;stroke-width:1;" x1="485.3945" x2="526.3945" y1="708.4102" y2="708.4102"/><polygon fill="#45647D" points="495.3945,704.4102,485.3945,708.4102,495.3945,712.4102,491.3945,708.4102" style="stroke:#45647D;stroke-width:1;"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="241.3018" x="496.3945" y="685.457">Persiste active et recipientSessionId</text></g><g class="message" data-participant-1="node" data-participant-2="alice"><polygon fill="#45647D" points="65.0605,744.8984,55.0605,748.8984,65.0605,752.8984,61.0605,748.8984" style="stroke:#45647D;stroke-width:1;"/><line style="stroke:#45647D;stroke-width:1;stroke-dasharray:2,2;" x1="59.0605" x2="483.3945" y1="748.8984" y2="748.8984"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.8369" x="76.0605" y="738.9453">call.updated &#183; active</text></g><g class="message" data-participant-1="alice" data-participant-2="node"><polygon fill="#45647D" points="472.3945,785.3867,482.3945,789.3867,472.3945,793.3867,476.3945,789.3867" style="stroke:#45647D;stroke-width:1;"/><line style="stroke:#45647D;stroke-width:1;" x1="54.0605" x2="478.3945" y1="789.3867" y2="789.3867"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="336.0137" x="66.0605" y="779.4336">POST /api/calls/{id}/signal {type:"offer",data:SDP}</text></g><g class="message" data-participant-1="node" data-participant-2="bob"><polygon fill="#45647D" points="880.1494,825.875,890.1494,829.875,880.1494,833.875,884.1494,829.875" style="stroke:#45647D;stroke-width:1;"/><line style="stroke:#45647D;stroke-width:1;" x1="484.3945" x2="886.1494" y1="829.875" y2="829.875"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="265.9316" x="496.3945" y="819.9219">WS call.signal &#224; la seule session de Bob</text></g><g class="message" data-participant-1="bob" data-participant-2="node"><polygon fill="#45647D" points="495.3945,866.3633,485.3945,870.3633,495.3945,874.3633,491.3945,870.3633" style="stroke:#45647D;stroke-width:1;"/><line style="stroke:#45647D;stroke-width:1;" x1="489.3945" x2="891.1494" y1="870.3633" y2="870.3633"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270.751" x="506.3945" y="860.4102">POST &#8230;/signal {type:"answer",data:SDP}</text></g><g class="message" data-participant-1="node" data-participant-2="alice"><polygon fill="#45647D" points="65.0605,906.8516,55.0605,910.8516,65.0605,914.8516,61.0605,910.8516" style="stroke:#45647D;stroke-width:1;"/><line style="stroke:#45647D;stroke-width:1;" x1="59.0605" x2="483.3945" y1="910.8516" y2="910.8516"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="265.3916" x="76.0605" y="900.8984">WS call.signal &#224; la seule session d&#8217;Alice</text></g><g class="message" data-participant-1="alice" data-participant-2="node"><polygon fill="#45647D" points="65.0605,947.3398,55.0605,951.3398,65.0605,955.3398,61.0605,951.3398" style="stroke:#45647D;stroke-width:1;"/><polygon fill="#45647D" points="472.3945,947.3398,482.3945,951.3398,472.3945,955.3398,476.3945,951.3398" style="stroke:#45647D;stroke-width:1;"/><line style="stroke:#45647D;stroke-width:1;" x1="59.0605" x2="478.3945" y1="951.3398" y2="951.3398"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="396.334" x="76.0605" y="941.3867">POST &#8230;/signal et livraison WS des ICE, dans les deux sens</text></g><g class="message" data-participant-1="node" data-participant-2="bob"><polygon fill="#45647D" points="495.3945,987.8281,485.3945,991.8281,495.3945,995.8281,491.3945,991.8281" style="stroke:#45647D;stroke-width:1;"/><polygon fill="#45647D" points="880.1494,987.8281,890.1494,991.8281,880.1494,995.8281,884.1494,991.8281" style="stroke:#45647D;stroke-width:1;"/><line style="stroke:#45647D;stroke-width:1;" x1="489.3945" x2="886.1494" y1="991.8281" y2="991.8281"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="373.7549" x="506.3945" y="981.875">ICE mis en attente tant que remoteDescription manque</text></g><g class="message" data-participant-1="alice" data-participant-2="bob"><polygon fill="#45647D" points="65.0605,1044.8047,55.0605,1048.8047,65.0605,1052.8047,61.0605,1048.8047" style="stroke:#45647D;stroke-width:1;"/><polygon fill="#45647D" points="880.1494,1044.8047,890.1494,1048.8047,880.1494,1052.8047,884.1494,1048.8047" style="stroke:#45647D;stroke-width:1;"/><line style="stroke:#45647D;stroke-width:1;" x1="59.0605" x2="886.1494" y1="1048.8047" y2="1048.8047"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="322.123" x="76.0605" y="1022.3633">RTCPeerConnection({iceServers:[]}) &#183; DTLS-SRTP</text><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="421.7432" x="76.0605" y="1038.8516">Audio et vid&#233;o entre pairs. ontrack alimente le lecteur distant.</text></g><path d="M22,1065.8047 L22,1112.8047 A4,4 0 0 0 26,1116.8047 L919,1116.8047 A4,4 0 0 0 923,1112.8047 L923,1071.8047 L913,1061.8047 L26,1061.8047 A4,4 0 0 0 22,1065.8047" fill="#FFF4DB" style="stroke:#AB8046;stroke-width:0.5;"/><path d="M913,1061.8047 L913,1069.8047 A2,2 0 0 0 915,1071.8047 L923,1071.8047 L913,1061.8047" fill="#FFF4DB" style="stroke:#AB8046;stroke-width:0.5;"/><text fill="#48361A" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="645.498" x="145.356" y="1086.3066">Micro et cam&#233;ra basculent track.enabled. La r&#233;ception se contr&#244;le sur chaque navigateur</text><text fill="#48361A" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="571.8018" x="145.356" y="1103.9727">par inbound-rtp.bytesReceived (audio) et inbound-rtp.framesDecoded (vid&#233;o).</text><g class="message" data-participant-1="bob" data-participant-2="node"><polygon fill="#45647D" points="495.3945,1150.625,485.3945,1154.625,495.3945,1158.625,491.3945,1154.625" style="stroke:#45647D;stroke-width:1;"/><line style="stroke:#45647D;stroke-width:1;" x1="489.3945" x2="891.1494" y1="1154.625" y2="1154.625"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="166.79" x="506.3945" y="1144.6719">POST /api/calls/{id}/end</text></g><g class="message" data-participant-1="node" data-participant-2="alice"><polygon fill="#45647D" points="65.0605,1207.6016,55.0605,1211.6016,65.0605,1215.6016,61.0605,1211.6016" style="stroke:#45647D;stroke-width:1;"/><line style="stroke:#45647D;stroke-width:1;stroke-dasharray:2,2;" x1="59.0605" x2="483.3945" y1="1211.6016" y2="1211.6016"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="314.5488" x="76.0605" y="1185.1602">call.updated &#183; ended. Les deux clients ferment</text><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="245.6631" x="76.0605" y="1201.6484">le peer et arr&#234;tent les pistes locales.</text></g><rect fill="#F4F8FB" height="69.4648" rx="4" ry="4" style="stroke:#AABCCA;stroke-width:1;" width="776.8203" x="194.4546" y="1239.6016"/><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="676.2383" x="204.4546" y="1263.1367">Une invitation de plus de 60 s expire au prochain contr&#244;le des appels. Une session WS d&#233;connect&#233;e</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="756.8203" x="204.4546" y="1279.625">sans reconnexion pendant 10 s cl&#244;t son appel. Au red&#233;marrage du serveur, ringing et active deviennent ended.</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="725.9561" x="204.4546" y="1296.1133">SDP et ICE circulent en m&#233;moire. Le fichier contient les m&#233;tadonn&#233;es d&#8217;appel. Essais E22 (local) et E24 (CI).</text><!--SRC=[dLPDJoD74BtxLvJOmu9Y33PUFgpTI3R64H7B8imgXv13UwPjEinqJxfx-8Y5j7yZjvmYaVDAkSV_P7z9NlNuO