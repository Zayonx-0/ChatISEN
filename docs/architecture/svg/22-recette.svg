<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="562px" preserveAspectRatio="none" style="width:1220px;height:562px;background:#FFFFFF;" version="1.1" viewBox="0 0 1220 562" width="1220px" zoomAndPan="magnify"><title>Refaire le parcours et reconna&#238;tre le r&#233;sultat attendu</title><defs/><g><g class="title" data-source-line="25"><text fill="#17334D" font-family="sans-serif" font-size="21" font-weight="bold" lengthAdjust="spacing" textLength="570.1069" x="321.0725" y="35.3027">Refaire le parcours et reconna&#238;tre le r&#233;sultat attendu</text></g><g class="legend" data-source-line="26"><rect fill="#F4F8FB" height="464.7891" rx="4" ry="4" style="stroke:#AABCCA;stroke-width:1;" width="1188.252" x="12" y="77.7324"/><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="707.5059" x="22" y="101.2676">Deux navigateurs ind&#233;pendants pour Alice et Bob. Un troisi&#232;me compte, &#200;ve, reste ext&#233;rieur au fil.</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="126.3965" x="31.6143" y="124.7559">Parcours du sujet</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="199.7188" x="241.75" y="124.7559">R&#233;alisation au SHA bf1cd60</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="174.7471" x="653.1699" y="124.7559">Observation qui tranche</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="113.8936" x="31.4297" y="151.2441">Compte et direct</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="175.458" x="241.5654" y="151.2441">React &#8594; v1 &#8594; PostgreSQL</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="389.9561" x="652.9854" y="151.2441">Cookie Secure, 401 apr&#232;s r&#233;vocation, un seul ID de direct</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.5898" x="31.4297" y="177.7324">Texte priv&#233; et groupe</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="261.7891" x="241.5654" y="177.7324">v1, transaction + journal + WebSocket</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="408.707" x="652.9854" y="177.7324">Un seul ID apr&#232;s retry, 409 si contenu diff&#233;rent, tiers &#8594; 404</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.7656" x="31.4297" y="204.2207">Historique et coupure</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="372.3057" x="241.5654" y="204.2207">React reprend depuis seq, garde les brouillons en RAM</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="514.7598" x="652.9854" y="204.2207">Bob hors ligne 15 s, 20 messages uniques, relecture apr&#232;s red&#233;marrage API</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="111.1523" x="31.4297" y="230.709">R&#244;les du groupe</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="245.6152" x="241.5654" y="230.709">Routes v1 de gestion, UI de cr&#233;ation</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="493.377" x="652.9854" y="230.709">Transfert puis d&#233;part, un seul owner actif, fermeture du dernier membre</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="191.2764" x="31.4297" y="257.1973">Audio / vid&#233;o du profil local</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="297.0488" x="241.5654" y="257.1973">WebRTC direct, deux pairs sur une machine</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="479.6367" x="652.9854" y="257.1973">Octets audio et images d&#233;cod&#233;es de chaque c&#244;t&#233;, refus et raccrochage</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.6445" x="31.4297" y="283.6855">Audio / vid&#233;o Compose</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="303.7344" x="241.5654" y="283.6855">Admission v1 exp&#233;rimentale, SFU configur&#233;e</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="472.9922" x="652.9854" y="283.6855">&#192; &#233;tablir : pistes distantes, mute/cam&#233;ra et r&#233;vocation sur pile HTTPS</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="186.2109" x="31.4297" y="310.1738">D&#233;ploiement et supervision</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="261.3926" x="241.5654" y="310.1738">Compose local + provisioning Grafana</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="486.4521" x="652.9854" y="310.1738">&#192; &#233;tablir : profil vierge, navigation HTTPS, m&#233;triques v1 et courbes UTC</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149.2422" x="31.4297" y="336.6621">Acc&#232;s du jury sur GCP</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="392.5605" x="241.5654" y="336.6621">D&#233;mo standalone sur le domaine ISEN, Caddy HTTPS :443</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="455.1572" x="652.9854" y="336.6621">Sondes 200. R&#233;ception m&#233;dia sur deux r&#233;seaux encore &#224; &#233;prouver.</text><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="1177.1748" y1="106.2207" y2="106.2207"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="1177.1748" y1="132.709" y2="132.709"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="1177.1748" y1="159.1973" y2="159.1973"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="1177.1748" y1="185.6855" y2="185.6855"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="1177.1748" y1="212.1738" y2="212.1738"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="1177.1748" y1="238.6621" y2="238.6621"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="1177.1748" y1="265.1504" y2="265.1504"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="1177.1748" y1="291.6387" y2="291.6387"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="1177.1748" y1="318.127" y2="318.127"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="1177.1748" y1="344.6152" y2="344.6152"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="22" y1="106.2207" y2="344.6152"/><line style="stroke:#17334D;stroke-width:1;" x1="232.1357" x2="232.1357" y1="106.2207" y2="344.6152"/><line style="stroke:#17334D;stroke-width:1;" x1="643.5557" x2="643.5557" y1="106.2207" y2="344.6152"/><line style="stroke:#17334D;stroke-width:1;" x1="1177.1748" x2="1177.1748" y1="106.2207" y2="344.6152"/><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="22" y="360.1504">&#160;</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="277.4844" x="22" y="376.6387">Extensions et investigation du mandat</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="39.3408" x="31.6143" y="400.127">Objet</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="159.127" x="257.2129" y="400.127">Point d&#8217;ancrage actuel</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="128.4883" x="682.0313" y="400.127">Preuve &#224; produire</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="192.5273" x="31.4297" y="426.6152">Conf&#233;rence, partage d&#8217;&#233;cran</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="256.3613" x="257.0283" y="426.6152">Cible LiveKit &#183; client React &#224; raccorder</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="421.4424" x="681.8467" y="426.6152">3 participants, piste &#233;cran distante, d&#233;part et arr&#234;t du partage</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.46" x="31.4297" y="453.1035">Partage de fichiers v1</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="405.959" x="257.0283" y="453.1035">Table attachments, OpenAPI /files, upload volatil historique</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="445.792" x="681.8467" y="453.1035">Envoi et relecture apr&#232;s red&#233;marrage, hash identique, tiers refus&#233;</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.209" x="31.4297" y="479.5918">Qualit&#233;, &#233;tude et IA</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="358.873" x="257.0283" y="479.5918">quality_samples, analyse CSV dans analysis/study.py</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="427.0479" x="681.8467" y="479.5918">Jeux r&#233;els de getStats, m&#233;thode, r&#233;sultats et &#233;valuation du PoC</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="206.7393" x="31.4297" y="506.0801">Pannes, charge et restauration</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="317.7549" x="257.0283" y="506.0801">Journal PG, sondes, proc&#233;dure pg_dump + age</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="498.9756" x="681.8467" y="506.0801">Deux processus, mesures sous charge, restauration et RPO/RTO mesur&#233;s</text><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="1190.252" y1="381.5918" y2="381.5918"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="1190.252" y1="408.0801" y2="408.0801"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="1190.252" y1="434.5684" y2="434.5684"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="1190.252" y1="461.0566" y2="461.0566"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="1190.252" y1="487.5449" y2="487.5449"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="1190.252" y1="514.0332" y2="514.0332"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="22" y1="381.5918" y2="514.0332"/><line style="stroke:#17334D;stroke-width:1;" x1="247.5986" x2="247.5986" y1="381.5918" y2="514.0332"/><line style="stroke:#17334D;stroke-width:1;" x1="672.417" x2="672.417" y1="381.5918" y2="514.0332"/><line style="stroke:#17334D;stroke-width:1;" x1="1190.252" x2="1190.252" y1="381.5918" y2="514.0332"/><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="774.252" x="22" y="529.5684">J1 exige le parcours int&#233;gr&#233; sur Compose. Les tests sur loopback et l&#8217;admission sign&#233;e ont leurs propres preuves.</text></g><!--SRC=[XLOzRnj74EtrAmPmQK8Y9LeVXcE0eaHRZcBHf9IKnl9kULphRlUy7vGOk70