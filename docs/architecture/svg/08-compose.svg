.8318,524.8316 C725.1687,545.0785 756.9652,566.2995 788.207,587.1503" fill="none" style="stroke:#45647D;stroke-width:1;"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="237.0703" x="769" y="563.2676">SQL dans l&#8217;ordre du nom de fichier</text></g><g class="link" data-entity-1="graf" data-entity-2="prom" data-uid="lnk19" id="link_graf_prom"><polygon fill="#45647D" points="1243.6613,285.7198,1246.3964,276.2583,1242.9793,280.7665,1238.4711,277.3494,1243.6613,285.7198" style="stroke:#45647D;stroke-width:1;"/><path d="M1233.359,210.8924 C1236.4486,233.3325 1239.7579,257.3688 1242.8429,279.7758" fill="none" style="stroke:#45647D;stroke-width:1;"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.4854" x="1246" y="249.2676">http://prometheus:9090</text></g><g class="link" data-entity-1="prom" data-entity-2="api" data-uid="lnk20" id="link_prom_api"><polygon fill="#45647D" points="1263.004,441.5154,1265.8782,432.0952,1262.3951,436.5526,1257.9377,433.0695,1263.004,441.5154" style="stroke:#45647D;stroke-width:1;"/><path d="M1251.9037,351.0474 C1255.0753,376.8963 1258.8393,407.5727 1262.2733,435.56" fill="none" style="stroke:#45647D;stroke-width:1;"/><text fill="#274961" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="148.374" x="1267" y="406.2676">/metrics sur api:3000</text></g><g class="legend" data-source-line="48"><rect fill="#F4F8FB" height="151.9063" rx="4" ry="4" style="stroke:#AABCCA;stroke-width:1;" width="747.4258" x="344.7871" y="712.7324"/><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="398.959" x="354.7871" y="736.2676">Ordre de d&#233;marrage d&#233;clar&#233; dans docker-compose.yml</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="570.7803" x="354.7871" y="752.7559">postgres sain (pg_isready, 5 s / 3 s / 20 essais) &#8594; migrate sort avec 0 &#8594; api &#8594; web</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="539.9502" x="354.7871" y="769.2441">web + api + livekit d&#233;marr&#233;s &#8594; nginx. api d&#233;marr&#233;e &#8594; prometheus &#8594; grafana.</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="564.6758" x="354.7871" y="785.7324">DATABASE_URL vise postgres:5432/chatisen. La m&#234;me image sert &#224; migrate et api.</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="684.9883" x="354.7871" y="802.2207">L&#8217;API lit CSRF_SECRET, LIVEKIT_API_KEY, LIVEKIT_API_SECRET et LIVEKIT_URL=wss://localhost/livekit.</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="689.623" x="354.7871" y="818.709">Les cl&#233;s LiveKit correspondent au service du laboratoire. Le drapeau d&#8217;appel exp&#233;rimental est absent.</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="687.5313" x="354.7871" y="835.1973">GitHub Actions (Ubuntu 24.04) valide le YAML et teste s&#233;par&#233;ment avec PostgreSQL 17 et Chromium.</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="727.4258" x="354.7871" y="851.6855">Les ports indiqu&#233;s sont ceux du fichier local. La d&#233;monstration GCP utilise le profil standalone avec Caddy.</text></g><!--SRC=[XLRDRXit4BxhALZdaYAHLZzhIrua0MJPIeoeZclP0G88CBYxbCHubzoGNDbE4Q2dFa1llVNgdWlqNhr9dgGVkIjfRSieR4cxdE7CDpFV3Fb3fkWifIIXjp8tHAVCK45h-egBZ2gQaf16LpCbSn4FP28LkPvpmofoFQUnlEPYHgOqqLL9pAOqJynG2dD2KqR6LEWnKtowNMVClpBIsjqkB7m_QtKx7V-mecAuITXwTxkrJVJKthvIyheK-hjxVlUHiBAxtVNtzrhR50hSVaNaiXL99PWYlSfwHkFO9geQuuZDc8WF7YJvsT0VzeO7Z_MaYfagTVhzWy6WNz4vaOOzjZGS-eS73xNksJdeDVsz1ngLqFrUPwzLzQFPbvo9Y9rIPNZ4CohC8xT7UyFsyFysLL7u-ztz_MqRHdoAZxYFUR_LFpmOLhGZcMPIC9J3t2QCA1Q1n