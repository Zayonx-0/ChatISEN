<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="683px" preserveAspectRatio="none" style="width:927px;height:683px;background:#FFFFFF;" version="1.1" viewBox="0 0 927 683" width="927px" zoomAndPan="magnify"><title>14 &#183; Contrat HTTP v1 &#8212; comptes et conversations</title><defs/><g><g class="title" data-source-line="25"><text fill="#17334D" font-family="sans-serif" font-size="21" font-weight="bold" lengthAdjust="spacing" textLength="546.8203" x="186.3647" y="35.3027">14 &#183; Contrat HTTP v1 &#8212; comptes et conversations</text></g><g class="legend" data-source-line="26"><rect fill="#F4F8FB" height="586.207" rx="4" ry="4" style="stroke:#AABCCA;stroke-width:1;" width="895.5498" x="12" y="77.7324"/><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="93.2148" x="22" y="101.2676">Base /api/v1</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="537.7695" x="137.3633" y="101.2676">O = Origin &#233;gal &#224; CORS_ORIGIN. S = session valide. M = S + O + x-csrf-token.</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="62.2002" x="31.6143" y="124.7559">M&#233;thode</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="54.6943" x="113.043" y="124.7559">Chemin</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="111.46" x="391.7637" y="124.7559">Garde et entr&#233;e</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="48.2139" x="649.8604" y="124.7559">Succ&#232;s</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="35.0068" x="31.4297" y="151.2441">POST</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.2344" x="112.8584" y="151.2441">/auth/register</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="239.2373" x="391.5791" y="151.2441">O &#183; handle, displayName, password</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="178.001" x="649.6758" y="151.2441">201 {user: Profil} + cookie</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="35.0068" x="31.4297" y="177.7324">POST</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79.1396" x="112.8584" y="177.7324">/auth/login</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.5342" x="391.5791" y="177.7324">O &#183; handle, password</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="178.001" x="649.6758" y="177.7324">200 {user: Profil} + cookie</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="26.5576" x="31.4297" y="204.2207">GET</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="28.2119" x="112.8584" y="204.2207">/me</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="7.54" x="391.5791" y="204.2207">S</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.2949" x="649.6758" y="204.2207">200 Profil</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="35.0068" x="31.4297" y="230.709">POST</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="88.9287" x="112.8584" y="230.709">/auth/logout</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="12.0586" x="391.5791" y="230.709">M</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="188.7607" x="649.6758" y="230.709">204, suppression du cookie</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="26.5576" x="31.4297" y="257.1973">GET</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="43.832" x="112.8584" y="257.1973">/users</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="184.7344" x="391.5791" y="257.1973">S &#183; ?handle exact normalis&#233;</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="100.3857" x="649.6758" y="257.1973">200 Utilisateur</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="26.5576" x="31.4297" y="283.6855">GET</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="101.1514" x="112.8584" y="283.6855">/conversations</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="183.8799" x="391.5791" y="283.6855">S &#183; ?cursor=UUID&amp;limit=50</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="233.4336" x="649.6758" y="283.6855">200 {items: R&#233;sum&#233;[], nextCursor}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="26.5576" x="31.4297" y="310.1738">GET</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130.457" x="112.8584" y="310.1738">/conversations/{id}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="110.8721" x="391.5791" y="310.1738">S &#183; membre actif</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="70.335" x="649.6758" y="310.1738">200 D&#233;tail</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="35.0068" x="31.4297" y="336.6621">POST</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.2871" x="112.8584" y="336.6621">/conversations/direct</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="185.5273" x="391.5791" y="336.6621">M &#183; {peerId} diff&#233;rent de soi</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="238.4443" x="649.6758" y="336.6621">201 D&#233;tail ou 200 si la paire existe</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="35.0068" x="31.4297" y="363.1504">POST</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="156.1875" x="112.8584" y="363.1504">/conversations/groups</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="195.7744" x="391.5791" y="363.1504">M &#183; {title,memberIds,clientId}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="180.127" x="649.6758" y="363.1504">201 D&#233;tail ou 200 au retry</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="46.2246" x="31.4297" y="389.6387">PATCH</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130.457" x="112.8584" y="389.6387">/conversations/{id}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.7119" x="391.5791" y="389.6387">M &#183; owner &#183; {title}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="70.335" x="649.6758" y="389.6387">200 D&#233;tail</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="35.0068" x="31.4297" y="416.127">POST</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="259.8613" x="112.8584" y="416.127">/conversations/{id}/members/{userId}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.9512" x="391.5791" y="416.127">M &#183; owner</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="205.4473" x="649.6758" y="416.127">201 D&#233;tail ou 200 si d&#233;j&#224; actif</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="49.5674" x="31.4297" y="442.6152">DELETE</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="259.8613" x="112.8584" y="442.6152">/conversations/{id}/members/{userId}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.9512" x="391.5791" y="442.6152">M &#183; owner</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="26.5576" x="649.6758" y="442.6152">204</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="35.0068" x="31.4297" y="469.1035">POST</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="190.9961" x="112.8584" y="469.1035">/conversations/{id}/transfer</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="173.3457" x="391.5791" y="469.1035">M &#183; owner &#183; {newOwnerId}</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="70.335" x="649.6758" y="469.1035">200 D&#233;tail</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="35.0068" x="31.4297" y="495.5918">POST</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.4229" x="112.8584" y="495.5918">/conversations/{id}/leave</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.3906" x="391.5791" y="495.5918">M &#183; membre actif</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="26.5576" x="649.6758" y="495.5918">204</text><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="897.5498" y1="106.2207" y2="106.2207"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="897.5498" y1="132.709" y2="132.709"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="897.5498" y1="159.1973" y2="159.1973"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="897.5498" y1="185.6855" y2="185.6855"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="897.5498" y1="212.1738" y2="212.1738"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="897.5498" y1="238.6621" y2="238.6621"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="897.5498" y1="265.1504" y2="265.1504"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="897.5498" y1="291.6387" y2="291.6387"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="897.5498" y1="318.127" y2="318.127"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="897.5498" y1="344.6152" y2="344.6152"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="897.5498" y1="371.1035" y2="371.1035"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="897.5498" y1="397.5918" y2="397.5918"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="897.5498" y1="424.0801" y2="424.0801"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="897.5498" y1="450.5684" y2="450.5684"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="897.5498" y1="477.0566" y2="477.0566"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="897.5498" y1="503.5449" y2="503.5449"/><line style="stroke:#17334D;stroke-width:1;" x1="22" x2="22" y1="106.2207" y2="503.5449"/><line style="stroke:#17334D;stroke-width:1;" x1="103.4287" x2="103.4287" y1="106.2207" y2="503.5449"/><line style="stroke:#17334D;stroke-width:1;" x1="382.1494" x2="382.1494" y1="106.2207" y2="503.5449"/><line style="stroke:#17334D;stroke-width:1;" x1="640.2461" x2="640.2461" y1="106.2207" y2="503.5449"/><line style="stroke:#17334D;stroke-width:1;" x1="897.5498" x2="897.5498" y1="106.2207" y2="503.5449"/><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="22" y="519.0801">&#160;</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="159.3799" x="22" y="535.5684">Formats des r&#233;ponses</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="506.9668" x="22" y="552.0566">Utilisateur = {id,handle,displayName}. Profil ajoute createdAt et csrfToken.</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="703.4248" x="22" y="568.5449">R&#233;sum&#233; = {id,type,title,lastSeq,role,updatedAt}. D&#233;tail ajoute members[{user: Utilisateur,role,joinedAt}].</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="661.9443" x="22" y="585.0332">Direct = deux UUID tri&#233;s, titre null, deux r&#244;les member. nextCursor = dernier ID de page ou null.</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="603.5518" x="22" y="601.5215">Dates ISO UTC. UUID JSON en cha&#238;nes. lastSeq d&#233;cimal en cha&#238;ne. limit entier de 1 &#224; 100.</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="790.46" x="22" y="618.0098">Handle d&#8217;inscription normalis&#233; en minuscules, [a-z0-9_] sur 3-32. Nom affich&#233; &#233;lagu&#233; 1-80, mot de passe 12-128.</text><text fill="#17334D" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="62.8633" x="22" y="634.498">&#201;chec v1</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="682.7324" x="98.1523" y="634.498">{code,message,requestId}. 400 saisie &#183; 401 session &#183; 403 Origin/CSRF/r&#244;le &#183; 404 ressource masqu&#233;e</text><text fill="#17334D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="822.3018" x="22" y="650.9863">409 handle pris, &#233;tat incompatible ou r&#233;emploi de clientId avec un autre contenu. R&#232;gles de groupe d&#233;taill&#233;es en vue 11.</text></g><!--SRC=[dLRBRjj65DthAouGe9jG3ygCRGLn2ZsiM45Y6PQyCenWFBoI9YPdc9cX7x4DPDjzDzrr6MswAj1z-IVvajuXAOEsvGIf0S6avjvpxlECp9cG2TCiXbF6p-PQfJBigqXfk5W8YpLpTsuMB5GNGivXnY9JFGbnnjB83fMq-on6c31f9gZ5RBtDH7n6y5-iFooud_bR6nl1e69YXOtmphljhpjwohUhjRee3uCNcy7MeyEATtihw6pwwmoAk8FAKLujhhH43TkLxnCMXgvGrHpVuHnbs7jGv6V3OBWzx3ssKpf4NTfqkxr-lrknsLSM7oCDXy6Wzz3g7avlknLiFh2ef1viRspwLHw3drAK70-OjeABX4dxY7PtSzWU_iYf6aNGsUfqrZcy4pFwoFinT_pke3UiM7CL9qeYjSDUHGWQkMLo7bNdaKVCcAwrMfoc5aTSoRnrhTf2X0WO9_OAOhGB5PfQBPyUQYly-m_qgHQQMTYRJW_Wt8TlNtxF-ImQG4kFyXorOLOeQMfHtgWQmAlJrprc49ei4Srp_rNpz3Mulp7im5YBkP2GBUSiWknFw8yF9n_6XwCte_q6JCZ0e3441-Siek0Qy9w-cy1pSduEbtLkzAnkrHdA1X7TxC3xREdYHlVSNs1CsFJqXccNc0KgYywM-UaavJpxQk36ESB1U3AbVqsMsaLJurmOIpDxGpIKzeB9C48FGc6IY5sv7VPeXesve4wGKRlbmtLgKB-40wrc8hgbuBXIPmBNmKVAfVm0-nvSwmTmRtPpD9AI6of6uL6OFi6dKaklxtFJm0EJ9eak2nkcQx4TlydXASXVYoW1Bnct89MEgHicMvRKHrRGAxEOwliWzmRY3eodsYYzStGq6lmIYLZOdHUjLTeagR5v2OVPqgHnjZm-yK3YfUtdBhVVGMzUY_1sHH5ZVAeHA5WnAv47D1ZiKNtkGuJ2RKjUA0AvJX3rY413CPjbIqspGq8CHecovIj8bUOCHa34g8y4GeLo0_HTCYSIYRaZozVCSu4xKkFnI13XACzf3HbBQREjlbfHTAVzlIThaZEe2wV2TrItFr4N1zCiGgCNDncZXxXFLIJCbXzfhSjEv1o3tNUxqzt_pHByE5JIA6bckVs3r2LUZDtBggu_aN-4x1nNY8y6