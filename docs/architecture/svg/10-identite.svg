16E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="486.6128" x2="910.2036" y1="166.3965" y2="166.3965"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="493.6128" y="161.6543">2</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.8096" x="506.1885" y="161.6543">findUserByHandle normalise le handle en minuscules.</text></g><g class="message" data-participant-1="p2" data-participant-2="p3"><polygon fill="#37516E" points="1327.1738,207.0176,1337.1738,211.0176,1327.1738,215.0176,1331.1738,211.0176" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="916.2036" x2="1333.1738" y1="211.0176" y2="211.0176"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="923.2036" y="198.6201">3</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.2544" x="935.7793" y="190.9648">SELECT users par handle. &#192; l&#8217;inscription : Argon2id, 19 456</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.9492" x="935.7793" y="206.2754">Kio, t=2, p=1.</text></g><g class="message" data-participant-1="p2" data-participant-2="p1"><polygon fill="#37516E" points="497.6128,251.6387,487.6128,255.6387,497.6128,259.6387,493.6128,255.6387" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="491.6128" x2="915.2036" y1="255.6387" y2="255.6387"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="503.6128" y="243.2412">4</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.0513" x="516.1885" y="235.5859">Rend password_hash. argon2.verify contr&#244;le le mot de passe.</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.7876" x="516.1885" y="250.8965">&#201;chec : 401.</text></g><g class="message" data-participant-1="p1" data-participant-2="p2"><polygon fill="#37516E" points="904.2036,296.2598,914.2036,300.2598,904.2036,304.2598,908.2036,300.2598" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="486.6128" x2="910.2036" y1="300.2598" y2="300.2598"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="493.6128" y="287.8623">5</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393.0151" x="506.1885" y="280.207">G&#233;n&#232;re 32 octets al&#233;atoires en base64url. createSession re&#231;oit</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.4092" x="506.1885" y="295.5176">SHA-256 du jeton.</text></g><g class="message" data-participant-1="p2" data-participant-2="p3"><polygon fill="#37516E" points="1327.1738,340.8809,1337.1738,344.8809,1327.1738,348.8809,1331.1738,344.8809" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="916.2036" x2="1333.1738" y1="344.8809" y2="344.8809"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="923.2036" y="332.4834">6</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.3945" x="935.7793" y="324.8281">INSERT sessions. expires_at et absolute_expires_at sont fix&#233;s</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.0273" x="935.7793" y="340.1387">&#224; 24 h.</text></g><g class="message" data-participant-1="p1" data-participant-2="p0"><polygon fill="#37516E" points="63.3628,385.502,53.3628,389.502,63.3628,393.502,59.3628,389.502" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="57.3628" x2="485.6128" y1="389.502" y2="389.502"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="69.3628" y="377.1045">7</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.7925" x="81.9385" y="369.4492">200 {user}, avec csrfToken. Set-Cookie __Host-chatisen,</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="377.6411" x="81.9385" y="384.7598">Secure, HttpOnly, SameSite=Lax, Path=/, Max-Age=86400.</text></g><g class="message" data-participant-1="p0" data-participant-2="p1"><polygon fill="#37516E" points="474.6128,430.123,484.6128,434.123,474.6128,438.123,478.6128,434.123" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="52.3628" x2="480.6128" y1="434.123" y2="434.123"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="59.3628" y="421.7256">8</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.2671" x="71.9385" y="414.0703">GET /api/v1/me avec cookie. postgresAuthenticator recharge</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.4409" x="71.9385" y="429.3809">session valide et utilisateur. R&#233;ponse : profil &#224; la racine.</text></g><g class="message" data-participant-1="p0" data-participant-2="p1"><polygon fill="#37516E" points="474.6128,474.7441,484.6128,478.7441,474.6128,482.7441,478.6128,478.7441" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="52.3628" x2="480.6128" y1="478.7441" y2="478.7441"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="59.3628" y="466.3467">9</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="331.1699" x="71.9385" y="458.6914">POST /api/v1/auth/logout, Origin et x-csrf-token =</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.6348" x="71.9385" y="474.002">HMAC-SHA256(secret, jeton) en base64url.</text></g><g class="message" data-participant-1="p1" data-participant-2="p2"><polygon fill="#37516E" points="904.2036,504.0547,914.2036,508.0547,904.2036,512.0547,908.2036,508.0547" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="486.6128" x2="910.2036" y1="508.0547" y2="508.0547"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1514" x="493.6128" y="503.3125">10</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.4468" x="514.7642" y="503.3125">revokeSession &#233;crit revoked_at.</text></g><g class="message" data-participant-1="p1" data-participant-2="p0"><polygon fill="#37516E" points="63.3628,548.6758,53.3628,552.6758,63.3628,556.6758,59.3628,552.6758" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="57.3628" x2="485.6128" y1="552.6758" y2="552.6758"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1514" x="69.3628" y="540.2783">11</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="389.0986" x="90.5142" y="532.623">204, cookie effac&#233;. Un GET /me avec le jeton r&#233;voqu&#233; renvoie</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="28.7739" x="90.5142" y="547.9336">401.</text></g><!--SRC=[XLJ1Zk964Btp5QNTIo8POmF34YGYUGWpWtPscE3P6n9gx3BkdQRRszrc6ArMsci-8RVSikGSASer_fDyISesp40qqXuuu7xrkkgzLstkkSoOPcjOikX-fLKkuv4