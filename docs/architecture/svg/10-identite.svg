nt-2="p2"><polygon fill="#37516E" points="904.2036,178.8848,914.2036,182.8848,904.2036,186.8848,908.2036,182.8848" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="486.6128" x2="910.2036" y1="182.8848" y2="182.8848"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="493.6128" y="178.1426">2</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.8096" x="506.1885" y="178.1426">findUserByHandle normalise le handle en minuscules.</text></g><g class="message" data-participant-1="p2" data-participant-2="p3"><polygon fill="#37516E" points="1327.1738,223.5059,1337.1738,227.5059,1327.1738,231.5059,1331.1738,227.5059" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="916.2036" x2="1333.1738" y1="227.5059" y2="227.5059"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="923.2036" y="215.1084">3</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.2544" x="935.7793" y="207.4531">SELECT users par handle. &#192; l&#8217;inscription : Argon2id, 19 456</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.9492" x="935.7793" y="222.7637">Kio, t=2, p=1.</text></g><g class="message" data-participant-1="p2" data-participant-2="p1"><polygon fill="#37516E" points="497.6128,268.127,487.6128,272.127,497.6128,276.127,493.6128,272.127" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="491.6128" x2="915.2036" y1="272.127" y2="272.127"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="503.6128" y="259.7295">4</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.0513" x="516.1885" y="252.0742">Rend password_hash. argon2.verify contr&#244;le le mot de passe.</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.7876" x="516.1885" y="267.3848">&#201;chec : 401.</text></g><g class="message" data-participant-1="p1" data-participant-2="p2"><polygon fill="#37516E" points="904.2036,312.748,914.2036,316.748,904.2036,320.748,908.2036,316.748" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="486.6128" x2="910.2036" y1="316.748" y2="316.748"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="493.6128" y="304.3506">5</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393.0151" x="506.1885" y="296.6953">G&#233;n&#232;re 32 octets al&#233;atoires en base64url. createSession re&#231;oit</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.4092" x="506.1885" y="312.0059">SHA-256 du jeton.</text></g><g class="message" data-participant-1="p2" data-participant-2="p3"><polygon fill="#37516E" points="1327.1738,357.3691,1337.1738,361.3691,1327.1738,365.3691,1331.1738,361.3691" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="916.2036" x2="1333.1738" y1="361.3691" y2="361.3691"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="923.2036" y="348.9717">6</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.3945" x="935.7793" y="341.3164">INSERT sessions. expires_at et absolute_expires_at sont fix&#233;s</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.0273" x="935.7793" y="356.627">&#224; 24 h.</text></g><g class="message" data-participant-1="p1" data-participant-2="p0"><polygon fill="#37516E" points="63.3628,401.9902,53.3628,405.9902,63.3628,409.9902,59.3628,405.9902" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="57.3628" x2="485.6128" y1="405.9902" y2="405.9902"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="69.3628" y="393.5928">7</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.7925" x="81.9385" y="385.9375">200 {user}, avec csrfToken. Set-Cookie __Host-chatisen,</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="377.6411" x="81.9385" y="401.248">Secure, HttpOnly, SameSite=Lax, Path=/, Max-Age=86400.</text></g><g class="message" data-participant-1="p0" data-participant-2="p1"><polygon fill="#37516E" points="474.6128,446.6113,484.6128,450.6113,474.6128,454.6113,478.6128,450.6113" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="52.3628" x2="480.6128" y1="450.6113" y2="450.6113"/><text fill="#10283F" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="59.3628" y="438.2139">8</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.2671" x="71.9385" y="430.5586">GET /api/v1/me avec cookie. postgresAuthenticator recharge</text><text fill="#10283F" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.4409" x="71.9385" y="445.8691">session valide et utilisateur. R&#233;ponse : profil &#224; la racine.</text></g><g class="message" data-participant-1="p0" data-participant-2="p1"><polygon fill="#37516E" points="474.6128,491.2324,484.6128,495.2324,474.6128,499.2324,478.6128,495.2324" style="stroke:#37516E;stroke-width:1;"/><line style="stroke:#37516E;stroke-width:1;" x1="52.3628" x2="480.6128" y1="495.2324" y2="495.2324"/><