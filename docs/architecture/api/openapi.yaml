  /conversations/{conversationId}/files:
    post:
      tags: [files]
      operationId: createFile
      summary: Préparer un envoi direct vers l'Object Storage
      description: >-
        L'API vérifie le membre, le type et la taille, puis rend une URL signée. Le navigateur envoie
        les octets directement à Cloud Storage : ils ne traversent pas les VM applicatives.
      x-module: files
      x-scope: v2
      x-code: [api]
      x-today: Aucun équivalent (l'ancienne route /api garde 5 Mio en mémoire)
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody: { $ref: '#/components/requestBodies/CreateFile' }
      responses:
        '201':
          description: Fichier en attente et URL d'envoi à durée courte
          content: { application/json: { schema: { $ref: '#/components/schemas/FileUpload' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /files/{fileId}:
    patch:
      tags: [files]
      operationId: completeFile
      summary: Confirmer la fin de l'envoi (le serveur vérifie l'objet)
      x-module: files
      x-scope: v2
      x-code: [api]
      parameters:
        - { $ref: '#/components/parameters/FileId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody: { $ref: '#/components/requestBodies/CompleteFile' }
      responses:
        '200':
          description: Fichier utilisable dans un message
          content: { application/json: { schema: { $ref: '#/components/schemas/File' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedType' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [files]
      operationId: getFile
      summary: Obtenir les métadonnées et une URL de téléchargement signée
      description: Le nettoyage peut retirer un fichier confirmé qui reste sans message pendant 24 heures.
      x-module: files
      x-scope: v2
      x-code: [api]
      parameters: [{ $ref: '#/components/parameters/FileId' }]
      responses:
        '200':
          description: Réservé aux membres actifs de la conversation
          content: { application/json: { schema: { $ref: '#/components/schemas/FileDownload' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /calls/{callId}/quality-samples:
    post:
      tags: [quality]
      operationId: createQualitySamples
      summary: Envoyer des mesures getStats() par lot
      x-module: quality
      x-scope: v2
      x-code: [api]
      x-today: Table quality_samples présente, aucune route
      parameters:
        - { $ref: '#/components/parameters/CallId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody: { $ref: '#/components/requestBodies/CreateQualitySamples' }
      responses:
        '202':
          description: Lot accepté
          content:
            application/json:
              schema: { type: object, additionalProperties: false, required: [accepted], properties: { accepted: { const: true } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-chatisen
      description: Jeton opaque de 24 h. Seul son SHA-256 est stocké en base.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: HMAC de la session, fourni par GET /users/me
      schema: { type: string, minLength: 32, maxLength: 256 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    UserId: { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ConversationId: { name: conversationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    GroupId: { name: groupId, in: path, required: true, description: Même identifiant que la conversation du groupe, schema: { $ref: '#/components/schemas/Uuid' } }
    CallId: { name: callId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    FileId: { name: fileId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }

  requestBodies:
    CreateUser: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateUserRequest' } } } }
    UpdateUser: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateUserRequest' } } } }
    AdministerUser: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdministerUserRequest' } } } }
    CreateSession: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateSessionRequest' } } } }
    CreateDirectConversation: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDirectRequest' } } } }
    CreateGroup: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateGroupRequest' } } } }
    UpdateGroup: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateGroupRequest' } } } }
    PutMember: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutMemberRequest' } } } }
    CreateMessage: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateMessageRequest' } } } }
    CreateCall: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCallRequest' } } } }
    UpdateCall: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCallRequest' } } } }
    PutParticipation: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutParticipationRequest' } } } }
    CreateSignal: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CallSignal' } } } }
    CreatePushSubscription: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePushSubscriptionRequest' } } } }
    CreateFile: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateFileRequest' } } } }
    CompleteFile: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompleteFileRequest' } } } }
    CreateQualitySamples: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QualityBatch' } } } }

  responses:
    SessionOpened:
      description: Session créée. Le cookie est posé (Secure, HttpOnly, SameSite=Lax).
      headers:
        Set-Cookie: { schema: { type: string } }
      content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } }
    ConversationFound: { description: Conversation, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationDetail' } } } }
    ConversationCreated: { description: Conversation créée, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationDetail' } } } }
    CallFound: { description: Appel, content: { application/json: { schema: { $ref: '#/components/schemas/Call' } } } }
    BadRequest: { description: Entrée invalide, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Unauthorized: { description: Session absente ou expirée, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Forbidden: { description: "Origine, CSRF ou rôle refusé", content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    NotFound: { description: Absent ou non visible par cet utilisateur, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Conflict: { description: État incompatible ou clé réutilisée, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    TooLarge: { description: Fichier trop volumineux, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    UnsupportedType: { description: Type refusé, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    TooManyRequests: { description: Limite de débit atteinte, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Unavailable: { description: Fonction non configurée, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  schemas:
    Uuid: { type: string, format: uuid }
    Seq: { type: string, pattern: '^(0|[1-9][0-9]*)$', maxLength: 19, description: Entier signé 64 bits positif ou nul transmis en texte }
    DateTime: { type: string, format: date-time }
    Handle: { type: string, pattern: '^[a-z0-9_]{3,32}$' }
    DisplayName: { type: string, minLength: 1, maxLength: 80 }
    Password: { type: string, minLength: 12, maxLength: 128 }
    CallMode: { type: string, enum: [audio, video] }
    CallState: { type: string, enum: [ringing, active, ended] }
    MemberRole: { type: string, enum: [owner, moderator, member], description: moderator est prévu en V2 }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [handle, displayName, password]
      properties:
        handle: { $ref: '#/components/schemas/Handle' }
        displayName: { $ref: '#/components/schemas/DisplayName' }
        password: { $ref: '#/components/schemas/Password' }
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [handle, password]
      properties:
        handle: { $ref: '#/components/schemas/Handle' }
        password: { type: string, maxLength: 128, description: "Mot de passe du compte, y compris ceux des comptes importés" }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { $ref: '#/components/schemas/DisplayName' }
    AdministerUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        globalRole: { type: string, enum: [user, admin] }
        disabled: { type: boolean }
        revokeSessions: { const: true }
    AdminUserPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        nextCursor: { type: [string, 'null'] }
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, handle, displayName, createdAt, globalRole, disabled, activeSessions]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              handle: { $ref: '#/components/schemas/Handle' }
              displayName: { $ref: '#/components/schemas/DisplayName' }
              createdAt: { $ref: '#/components/schemas/DateTime' }
              globalRole: { type: string, enum: [user, admin] }
              disabled: { type: boolean }
              activeSessions: { type: integer, minimum: 0 }
    RestartTarget: { type: string, enum: [app-a, app-b, sfu-1, sfu-2, coturn, supervision] }
    RestartRequest:
      type: object
      additionalProperties: false
      required: [target, confirmation, password]
      properties:
        target: { $ref: '#/components/schemas/RestartTarget' }
        confirmation: { type: string, minLength: 1, maxLength: 63 }
        password: { type: string, maxLength: 128, writeOnly: true }
    AdminHealth: { type: string, enum: [healthy, down, unknown] }
    AdminSeries:
      type: array
      maxItems: 61
      items: { type: [number, 'null'] }
    AdminOverview:
      type: object
      additionalProperties: false
      required: [servers, database, alerts, metrics, activity, lastBackup, tls, grafanaCommand, restarts]
      properties:
        servers:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/AdminServer' }
        database: { $ref: '#/components/schemas/AdminHealth' }
        alerts:
          type: [array, 'null']
          items: { type: object, additionalProperties: false, required: [name, count], properties: { name: { type: string }, count: { type: integer, minimum: 1 } } }
        metrics:
          type: object
          description: Séries alignées sur les quinze dernières minutes, un point toutes les quinze secondes. Les trous sont nuls.
          propertyNames: { enum: [httpRequests, httpErrors, httpP95, websockets, messages, deliveryP95, outboxAge, pushFailures, directCalls, relayCalls, callRtt, callJitter, callBitrate, callLoss] }
          additionalProperties: { $ref: '#/components/schemas/AdminSeries' }
        activity:
          type: object
          additionalProperties: false
          required: [accounts, conversations, dailyMessages, activeCalls, fileBytes]
          properties:
            accounts:
              type: [object, 'null']
              additionalProperties: false
              required: [total, active, disabled]
              properties:
                total: { type: integer, minimum: 0 }
                active: { type: integer, minimum: 0 }
                disabled: { type: integer, minimum: 0 }
            conversations: { type: [integer, 'null'], minimum: 0 }
            dailyMessages:
              type: [array, 'null']
              items: { type: object, additionalProperties: false, required: [day, count], properties: { day: { type: string, format: date }, count: { type: integer, minimum: 0 } } }
            activeCalls: { type: [integer, 'null'], minimum: 0 }
            fileBytes: { type: [integer, 'null'], minimum: 0 }
        lastBackup: { type: [string, 'null'], format: date-time }
        tls:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [endpoint, expiresAt, expiring]
            properties:
              endpoint: { type: string, enum: [load-balancer, coturn] }
              expiresAt: { type: [string, 'null'], format: date-time }
              expiring: { type: [boolean, 'null'] }
        grafanaCommand: { type: [string, 'null'] }
        restarts:
          type: [object, 'null']
          additionalProperties: false
          required: [enabled, active, retryAt]
          properties:
            enabled: { type: boolean }
            active: { type: [string, 'null'], enum: [app-a, app-b, sfu-1, sfu-2, coturn, supervision, null] }
            retryAt: { type: [string, 'null'], format: date-time }
    AdminServer:
      type: object
      additionalProperties: false
      required: [target, health, confirmationName, resources, digests]
      properties:
        target: { $ref: '#/components/schemas/RestartTarget' }
        health: { $ref: '#/components/schemas/AdminHealth' }
        confirmationName: { type: [string, 'null'], description: Nom à saisir pour confirmer un redémarrage disponible }
        resources:
          type: object
          additionalProperties: false
          required: [cpu, memory, disk]
          properties:
            cpu: { $ref: '#/components/schemas/AdminSeries' }
            memory: { $ref: '#/components/schemas/AdminSeries' }
            disk: { $ref: '#/components/schemas/AdminSeries' }
        digests:
          type: [object, 'null']
          additionalProperties: false
          required: [api, edge]
          properties:
            api: { type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$' }
            edge: { type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$' }
    UserPublic:
      type: object
      required: [id, handle, displayName]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        handle: { $ref: '#/components/schemas/Handle' }
        displayName: { $ref: '#/components/schemas/DisplayName' }
    UserProfile:
      type: object
      required: [id, handle, displayName, createdAt, csrfToken]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        handle: { $ref: '#/components/schemas/Handle' }
        displayName: { $ref: '#/components/schemas/DisplayName' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        csrfToken: { type: string }
        globalRole: { type: string, enum: [user, admin] }
    AuditEvent:
      type: object
      required: [id, actorId, action, targetType, targetId, detail, at]
      properties:
        id: { type: string }
        actorId: { $ref: '#/components/schemas/Uuid' }
        action: { type: string, examples: [group.role_changed] }
        targetType: { $ref: '#/components/schemas/AuditTargetType' }
        targetId: { $ref: '#/components/schemas/Uuid' }
        detail: { type: object }
        at: { $ref: '#/components/schemas/DateTime' }
    AuditEventPage:
      type: object
      required: [items, nextBeforeId]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AuditEvent' } }
        nextBeforeId: { type: [string, 'null'] }
    AuditTargetType: { type: string, enum: [user, conversation, server] }
    UserList:
      type: object
      required: [items]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/UserPublic' } }
    CreateDirectRequest:
      type: object
      additionalProperties: false
      required: [peerId]
      properties:
        peerId: { $ref: '#/components/schemas/Uuid' }
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required: [clientId, title, memberIds]
      properties:
        clientId: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 120 }
        memberIds: { type: array, minItems: 1, maxItems: 99, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
    UpdateGroupRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
    PutMemberRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/MemberRole' }
    Member:
      type: object
      required: [user, role, joinedAt]
      properties:
        user: { $ref: '#/components/schemas/UserPublic' }
        role: { $ref: '#/components/schemas/MemberRole' }
        joinedAt: { $ref: '#/components/schemas/DateTime' }
    ConversationSummary:
      type: object
      required: [id, type, title, lastSeq, role, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type: { type: string, enum: [direct, group] }
        title: { type: [string, 'null'], maxLength: 120 }
        lastSeq: { $ref: '#/components/schemas/Seq' }
        role: { $ref: '#/components/schemas/MemberRole' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    ConversationList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ConversationSummary' } }
        nextCursor: { type: [string, 'null'] }
    ConversationDetail:
      allOf:
        - { $ref: '#/components/schemas/ConversationSummary' }
        - type: object
          required: [members]
          properties:
            members: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/Member' } }
    CreateMessageRequest:
      type: object
      additionalProperties: false
      required: [clientId]
      anyOf:
        - required: [text]
        - required: [fileId]
      properties:
        clientId: { $ref: '#/components/schemas/Uuid' }
        text: { type: string, minLength: 1, maxLength: 4000 }
        fileId: { $ref: '#/components/schemas/Uuid' }
    Message:
      type: object
      required: [id, conversationId, seq, senderId, clientId, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        conversationId: { $ref: '#/components/schemas/Uuid' }
        seq: { $ref: '#/components/schemas/Seq' }
        senderId: { $ref: '#/components/schemas/Uuid' }
        clientId: { $ref: '#/components/schemas/Uuid' }
        text: { type: string, maxLength: 4000 }
        fileId: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    MessagePage:
      type: object
      required: [items, nextBeforeSeq]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Message' } }
        nextBeforeSeq: { type: [string, 'null'] }
    Event:
      type: object
      required: [seq, at, event, data]
      properties:
        seq: { $ref: '#/components/schemas/Seq' }
        at: { $ref: '#/components/schemas/DateTime' }
        event: { type: string, examples: [message.created] }
        data: { type: object }
    EventPage:
      type: object
      required: [items, nextAfterSeq, hasMore]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Event' } }
        nextAfterSeq: { type: [string, 'null'] }
        hasMore: { type: boolean }
    CreateCallRequest:
      type: object
      additionalProperties: false
      required: [clientId, mode]
      properties:
        clientId: { $ref: '#/components/schemas/Uuid' }
        mode: { $ref: '#/components/schemas/CallMode' }
    Call:
      type: object
      required: [id, conversationId, initiatorId, mode, topology, state, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        conversationId: { $ref: '#/components/schemas/Uuid' }
        initiatorId: { $ref: '#/components/schemas/Uuid' }
        mode: { $ref: '#/components/schemas/CallMode' }
        topology: { type: string, enum: [p2p, sfu], description: "p2p à deux, sfu pour une conférence (V2)" }
        state: { $ref: '#/components/schemas/CallState' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        endedAt: { $ref: '#/components/schemas/DateTime' }
    CallList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Call' } }
    UpdateCallRequest:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, const: ended }
    PutParticipationRequest:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, enum: [joined, declined, left] }
    CallSignal:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: { type: string, enum: [offer, answer, ice] }
        data: { type: object, description: "RTCSessionDescriptionInit ou RTCIceCandidateInit, 30 000 caractères au plus" }
    IceServer:
      type: object
      required: [urls]
      properties:
        urls: { type: array, items: { type: string }, examples: [['stun:turn.example:3478', 'turns:turn.example:5349?transport=tcp']] }
        username: { type: string, description: Échéance et identifiant utilisateur }
        credential: { type: string, description: HMAC à durée courte (mécanisme REST de coturn) }
    IceServerList:
      type: object
      required: [iceServers, expiresAt]
      properties:
        iceServers: { type: array, items: { $ref: '#/components/schemas/IceServer' } }
        expiresAt: { $ref: '#/components/schemas/DateTime' }
    MediaToken:
      type: object
      required: [serverUrl, token, expiresAt]
      properties:
        serverUrl: { type: string, format: uri }
        token: { type: string }
        expiresAt: { $ref: '#/components/schemas/DateTime' }
    PushConfiguration:
      type: object
      required: [available, publicKey]
      properties:
        available: { type: boolean }
        publicKey: { type: [string, 'null'] }
    CreatePushSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri, maxLength: 2048, description: Fournisseurs autorisés uniquement }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
    PushSubscriptionRef:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
    CreateFileRequest:
      type: object
      additionalProperties: false
      required: [fileName, mediaType, size, sha256]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        mediaType: { type: string, enum: [image/png, image/jpeg, application/pdf, text/plain] }
        size: { type: integer, minimum: 1, maximum: 26214400, description: "Plafond proposé de 25 Mio, à valider" }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    File:
      type: object
      required: [id, fileName, mediaType, size, state]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        fileName: { type: string }
        mediaType: { type: string }
        size: { type: integer }
        state: { type: string, enum: [pending, available, rejected] }
    FileUpload:
      type: object
      required: [file, uploadUrl, headers, expiresAt]
      properties:
        file: { $ref: '#/components/schemas/File' }
        uploadUrl: { type: string, format: uri, description: URL signée Cloud Storage }
        headers:
          type: object
          description: En-têtes signés à reprendre au PUT. La précondition de génération réserve l'URL à la création de l'objet.
          required: [x-goog-if-generation-match]
          properties:
            x-goog-if-generation-match: { const: '0' }
          additionalProperties: { type: string }
        expiresAt: { $ref: '#/components/schemas/DateTime' }
    CompleteFileRequest:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, const: available }
    FileDownload:
      type: object
      required: [file, downloadUrl, expiresAt]
      properties:
        file: { $ref: '#/components/schemas/File' }
        downloadUrl: { type: string, format: uri }
        expiresAt: { $ref: '#/components/schemas/DateTime' }
    QualitySample:
      type: object
      additionalProperties: false
      required: [capturedAt, packetsReceived, packetsLost, jitterMs, rttMs, bitrateKbps, candidateType]
      properties:
        capturedAt: { $ref: '#/components/schemas/DateTime' }
        packetsReceived: { type: integer, minimum: 0 }
        packetsLost: { type: integer, minimum: 0 }
        jitterMs: { type: number, minimum: 0 }
        rttMs: { type: number, minimum: 0 }
        bitrateKbps: { type: number, minimum: 0 }
        candidateType: { type: string, enum: [host, srflx, prflx, relay] }
    QualityBatch:
      type: object
      additionalProperties: false
      required: [samples]
      properties:
        samples: { type: array, minItems: 1, maxItems: 30, items: { $ref: '#/components/schemas/QualitySample' } }
    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string, examples: [VALIDATION_ERROR, UNAUTHORIZED, NOT_FOUND, IDEMPOTENCY_CONFLICT] }
        message: { type: string, maxLength: 240 }
        requestId: { $ref: '#/components/schemas/Uuid', description: Identifiant de corrélation des journaux de la passerelle et de l’API. }
