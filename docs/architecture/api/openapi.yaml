# Contrat REST de la cible ChatISEN (API-first). Ce fichier précède le code : il fixe l'interface front ↔ back.
# La CI vérifie que apps/api sert exactement ces opérations (tests/integration/conformance.test.ts).
#
# Extensions propres au projet :
#   x-module : module propriétaire dans le monolithe modulaire
#   x-scope  : mvp (obligatoire), mvp-plus (déjà fait en plus), v2 (extension prévue)
#   x-code   : etat du code au 26/11 -> api (apps/api, PostgreSQL, cible),
#              demo (serveur standalone en ligne), a-faire
#   x-today  : route(s) actuelles correspondantes
openapi: 3.1.0
info:
  title: ChatISEN API
  version: 2.0.0-cible
  summary: API REST orientée ressources du monolithe modulaire ChatISEN.
  description: >-
    JSON UTF-8, dates UTC, identifiants UUID. Session par cookie __Host-chatisen.
    Toute écriture authentifiée exige l'en-tête X-CSRF-Token et une origine autorisée.
    Les événements temps réel sont décrits à part dans asyncapi.yaml.
servers:
  - url: https://ia-pple.isen.fedyna.fr/api/v1
    description: Origine publique visée
security:
  - sessionCookie: []
tags:
  - { name: identity, description: "Comptes, sessions et profils" }
  - { name: groups, description: "Conversations, groupes, membres et rôles" }
  - { name: messaging, description: Messages et historique }
  - { name: calls, description: "Appels, signalisation et accès média" }
  - { name: notifications, description: Abonnements Web Push }
  - { name: files, description: Partage de fichiers (V2) }
  - { name: quality, description: Qualité des communications (V2) }
  - { name: operations, description: Console du webmaster (lot D) }

paths:
  /users:
    post:
      tags: [identity]
      operationId: createUser
      summary: Créer un compte
      x-module: identity
      x-scope: mvp
      x-code: [api, demo]
      x-today: POST /api/v1/auth/register
      security: []
      requestBody: { $ref: '#/components/requestBodies/CreateUser' }
      responses:
        '201': { $ref: '#/components/responses/SessionOpened' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [identity]
      operationId: searchUsers
      summary: Chercher des utilisateurs par identifiant ou nom
      x-module: identity
      x-scope: mvp
      x-code: [api, demo]
      x-today: GET /api/v1/users
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 32 } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Profils publics correspondants
          content: { application/json: { schema: { $ref: '#/components/schemas/UserList' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me:
    get:
      tags: [identity]
      operationId: getCurrentUser
      summary: Lire son profil et obtenir le jeton CSRF
      x-module: identity
      x-scope: mvp
      x-code: [api, demo]
      x-today: GET /api/v1/me
      responses:
        '200':
          description: Profil de la session
          content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [identity]
      operationId: updateCurrentUser
      summary: Modifier son nom affiché
      x-module: identity
      x-scope: mvp
      x-code: [api]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { $ref: '#/components/requestBodies/UpdateUser' }
      responses:
        '200':
          description: Profil mis à jour
          content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedType' }
  /users/{userId}:
    patch:
      tags: [identity]
      operationId: administerUser
      summary: Changer le rôle ou l’état d’un compte, ou révoquer ses sessions (administrateur)
      x-module: identity
      x-scope: v2
      x-code: [api]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody: { $ref: '#/components/requestBodies/AdministerUser' }
      responses:
        '200':
          description: Compte mis à jour, action inscrite au journal d'audit
          content: { application/json: { schema: { $ref: '#/components/schemas/UserPublic' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedType' }
  /audit-events:
    get:
      tags: [identity]
      operationId: listAuditEvents
      summary: Lire le journal d'audit (administrateur)
      x-module: identity
      x-scope: v2
      x-code: [api]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { name: beforeId, in: query, required: false, schema: { type: string, pattern: '^[1-9][0-9]{0,17}$' } }
        - { name: action, in: query, schema: { type: string, pattern: '^[a-z][a-z0-9_.-]{2,63}$' } }
        - { name: targetType, in: query, schema: { $ref: '#/components/schemas/AuditTargetType' } }
      responses:
        '200':
          description: Entrées de la plus récente à la plus ancienne
          content: { application/json: { schema: { $ref: '#/components/schemas/AuditEventPage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users:
    get:
      tags: [identity]
      operationId: listAdminUsers
      summary: Rechercher et lister les comptes, y compris désactivés (administrateur)
      x-module: identity
      x-scope: v2
      x-code: [api]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { name: cursor, in: query, schema: { $ref: '#/components/schemas/Handle' } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 }, description: Identifiant ou nom affiché }
      responses:
        '200':
          description: Comptes triés par identifiant et nombre de sessions actives
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserPage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/overview:
    get:
      tags: [operations]
      operationId: getAdminOverview
      summary: Lire la vue agrégée et l’état des redémarrages (administrateur)
      x-module: operations
      x-scope: v2
      x-code: [api]
      responses:
        '200':
          description: Vue d’ensemble. Une valeur nulle indique une donnée indisponible, sauf retryAt.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminOverview' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/restarts:
    post:
      tags: [operations]
      operationId: restartServer
      summary: Demander le redémarrage d’une VM autorisée (administrateur)
      description: Une seule demande active pour les deux réplicas. Un résultat incertain maintient le verrou jusqu’à confirmation.
      x-module: operations
      x-scope: v2
      x-code: [api]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RestartRequest' } } }
      responses:
        '202': { description: "Demande acceptée par Compute, redémarrage à vérifier" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /sessions:
    post:
      tags: [identity]
      operationId: createSession
      summary: Se connecter
      x-module: identity
      x-scope: mvp
      x-code: [api, demo]
      x-today: POST /api/v1/auth/login
      security: []
      requestBody: { $ref: '#/components/requestBodies/CreateSession' }
      responses:
        '201': { $ref: '#/components/responses/SessionOpened' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /sessions/current:
    delete:
      tags: [identity]
      operationId: deleteCurrentSession
      summary: Se déconnecter (révocation en base)
      x-module: identity
      x-scope: mvp
      x-code: [api, demo]
      x-today: POST /api/v1/auth/logout
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204': { description: Session révoquée et cookie effacé }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /conversations:
    get:
      tags: [groups]
      operationId: listConversations
      summary: Lister ses conversations privées et de groupe
      x-module: groups
      x-scope: mvp
      x-code: [api, demo]
      x-today: GET /api/v1/conversations
      parameters:
        - { name: cursor, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page de conversations dont on est membre actif
          content: { application/json: { schema: { $ref: '#/components/schemas/ConversationList' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [groups]
      operationId: createDirectConversation
      summary: Ouvrir (ou retrouver) une conversation privée
      x-module: groups
      x-scope: mvp
      x-code: [api, demo]
      x-today: POST /api/v1/conversations/direct
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { $ref: '#/components/requestBodies/CreateDirectConversation' }
      responses:
        '200': { $ref: '#/components/responses/ConversationFound' }
        '201': { $ref: '#/components/responses/ConversationCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedType' }
  /conversations/{conversationId}:
    get:
      tags: [groups]
      operationId: getConversation
      summary: Lire une conversation et ses membres
      x-module: groups
      x-scope: mvp
      x-code: [api]
      x-today: GET /api/v1/conversations/{id}
      parameters: [{ $ref: '#/components/parameters/ConversationId' }]
      responses:
        '200': { $ref: '#/components/responses/ConversationFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups:
    post:
      tags: [groups]
      operationId: createGroup
      summary: Créer un groupe (idempotent grâce à clientId)
      x-module: groups
      x-scope: mvp
      x-code: [api, demo]
      x-today: POST /api/v1/conversations/groups
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { $ref: '#/components/requestBodies/CreateGroup' }
      responses:
        '200': { $ref: '#/components/responses/ConversationFound' }
        '201': { $ref: '#/components/responses/ConversationCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedType' }
  /groups/{groupId}:
    patch:
      tags: [groups]
      operationId: updateGroup
      summary: Renommer un groupe (propriétaire)
      x-module: groups
      x-scope: mvp
      x-code: [api]
      x-today: PATCH /api/v1/conversations/{id}
      parameters:
        - { $ref: '#/components/parameters/GroupId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody: { $ref: '#/components/requestBodies/UpdateGroup' }
      responses:
        '200': { $ref: '#/components/responses/ConversationFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedType' }
  /groups/{groupId}/members/{userId}:
    put:
      tags: [groups]
      operationId: putGroupMember
      summary: Ajouter un membre ou changer son rôle (dont transfert de propriété)
      x-module: groups
      x-scope: mvp
      x-code: [api]
      x-today: POST /api/v1/conversations/{id}/members/{userId} et POST /api/v1/conversations/{id}/transfer
      description: Ajouter, nommer un moderator et transférer la propriété sont réservés au propriétaire.
      parameters:
        - { $ref: '#/components/parameters/GroupId' }
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody: { $ref: '#/components/requestBodies/PutMember' }
      responses:
        '200': { $ref: '#/components/responses/ConversationFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedType' }
    delete:
      tags: [groups]
      operationId: deleteGroupMember
      summary: Retirer un membre, ou quitter le groupe si userId est le sien
      x-module: groups
      x-scope: mvp
      x-code: [api, demo]
      x-today: DELETE /api/v1/conversations/{id}/members/{userId} et POST /api/v1/conversations/{id}/leave
      parameters:
        - { $ref: '#/components/parameters/GroupId' }
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '204': { description: "Membre retiré, ses abonnements au fil sont coupés" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /conversations/{conversationId}/messages:
    get:
      tags: [messaging]
      operationId: listMessages
      summary: Lire l'historique, du plus récent au plus ancien
      x-module: messaging
      x-scope: mvp
      x-code: [api, demo]
      x-today: GET /api/v1/conversations/{id}/messages
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
        - { name: beforeSeq, in: query, required: false, schema: { $ref: '#/components/schemas/Seq' } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page de messages triés par séquence décroissante
          content: { application/json: { schema: { $ref: '#/components/schemas/MessagePage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [messaging]
      operationId: createMessage
      summary: Envoyer un message (idempotent grâce à clientId)
      x-module: messaging
      x-scope: mvp
      x-code: [api, demo]
      x-today: POST /api/v1/conversations/{id}/messages
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody: { $ref: '#/components/requestBodies/CreateMessage' }
      responses:
        '200':
          description: Même clientId déjà enregistré, message existant renvoyé
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }
        '201':
          description: Message enregistré, événement message.created publié
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /conversations/{conversationId}/events:
    get:
      tags: [messaging]
      operationId: listEvents
      summary: Rattraper le journal après une coupure
      x-module: messaging
      x-scope: mvp
      x-code: [api]
      x-today: GET /api/v1/conversations/{id}/events
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
        - { name: afterSeq, in: query, required: true, schema: { $ref: '#/components/schemas/Seq' } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Événements strictement postérieurs au curseur
          content: { application/json: { schema: { $ref: '#/components/schemas/EventPage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversations/{conversationId}/calls:
    post:
      tags: [calls]
      operationId: createCall
      summary: Lancer un appel audio ou vidéo
      description: Dans un groupe dont une conférence est ouverte, celle-ci est renvoyée (200) pour être rejointe.
      x-module: calls
      x-scope: mvp
      x-code: [api, demo]
      x-today: POST /api/v1/conversations/{id}/calls
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody: { $ref: '#/components/requestBodies/CreateCall' }
      responses:
        '200': { $ref: '#/components/responses/CallFound' }
        '201': { $ref: '#/components/responses/CallFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedType' }
  /calls:
    get:
      tags: [calls]
      operationId: listCalls
      summary: Retrouver les appels qui sonnent (reprise après rechargement)
      x-module: calls
      x-scope: mvp
      x-code: [api, demo]
      x-today: GET /api/calls/incoming
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, enum: [ringing, active] } }
      responses:
        '200':
          description: Appels ouverts qui concernent l'utilisateur
          content: { application/json: { schema: { $ref: '#/components/schemas/CallList' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /calls/{callId}:
    patch:
      tags: [calls]
      operationId: updateCall
      summary: Terminer un appel
      x-module: calls
      x-scope: mvp
      x-code: [api, demo]
      x-today: POST /api/v1/calls/{id}/end
      parameters:
        - { $ref: '#/components/parameters/CallId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody: { $ref: '#/components/requestBodies/UpdateCall' }
      responses:
        '200': { $ref: '#/components/responses/CallFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedType' }
  /calls/{callId}/participants/me:
    put:
      tags: [calls]
      operationId: putOwnCallParticipation
      summary: Accepter, refuser ou quitter un appel
      description: Une conférence renvoie 409 tant que les évictions de la participation précédente sont en attente.
      x-module: calls
      x-scope: mvp
      x-code: [api, demo]
      x-today: POST /api/calls/{id}/answer
      parameters:
        - { $ref: '#/components/parameters/CallId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody: { $ref: '#/components/requestBodies/PutParticipation' }
      responses:
        '200': { $ref: '#/components/responses/CallFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedType' }
  /calls/{callId}/signals:
    post:
      tags: [calls]
      operationId: createCallSignal
      summary: Envoyer une offre, une réponse ou un candidat ICE au correspondant
      description: >-
        Le serveur relaie le signal sur le topic WebSocket user:{userId} du correspondant.
        Une nouvelle offre avec iceRestart sert à reprendre un appel après un changement de réseau (V2).
      x-module: calls
      x-scope: mvp
      x-code: [api, demo]
      x-today: POST /api/calls/{id}/signal
