      x-code: [api, demo]
      x-today: GET /api/push/config
      responses:
        '200':
          description: Disponibilité et clé publique
          content: { application/json: { schema: { $ref: '#/components/schemas/PushConfiguration' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /push-subscriptions:
    post:
      tags: [notifications]
      operationId: createPushSubscription
      summary: Enregistrer l'abonnement du navigateur courant
      x-module: notifications
      x-scope: mvp-plus
      x-code: [api, demo]
