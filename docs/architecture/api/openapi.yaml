      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { $ref: '#/components/requestBodies/CreatePushSubscription' }
      responses:
        '201':
          description: Abonnement lié à la session
          content: { application/json: { schema: { $ref: '#/components/schemas/PushSubscriptionRef' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedType' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /push-subscriptions/{subscriptionId}:
    delete:
      tags: [notifications]
      operationId: deletePushSubscription
      summary: Désactiver les notifications de ce navigateur
      x-module: notifications
      x-scope: mvp-plus
      x-code: [api, demo]
