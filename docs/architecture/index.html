<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Architecture · ChatISEN</title>
  <style>
    :root {
      color-scheme: light;
      font: 15px/1.5 Inter, system-ui, sans-serif;
      color: #182b3d;
      background: #e9eef3;
      --accent: #235a95;
      --line: #d1dbe5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template: auto minmax(0, 1fr) / 15.5rem minmax(0, 1fr);
    }
    a { color: var(--accent); }
    button, select { font: inherit; }
    button, select, .svg-link {
      padding: .37rem .65rem;
      border: 1px solid var(--line);
      border-radius: .4rem;
      background: white;
      color: #182b3d;
    }
    button:not(:disabled), select { cursor: pointer; }
    button:disabled { opacity: .42; }
    button:not(:disabled):hover, .svg-link:hover { background: #edf4fb; }
    :focus-visible { outline: 2px solid #3378bf; outline-offset: 3px; }
    h1, h2 { margin: 0; }
    .masthead {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .75rem 1.2rem;
      color: #f4f8fc;
      background: #17334d;
    }
    .masthead h1 { font-size: 1.1rem; font-weight: 650; }
    .masthead a { color: #ddebf9; font-size: .88rem; }
    .sidebar {
      min-height: 0;
      overflow: auto;
      padding: .85rem .75rem;
      border-right: 1px solid var(--line);
      background: #f7f9fb;
    }
    .sidebar h2 { margin: .15rem .55rem .5rem; font-size: .86rem; color: #365570; }
    .sidebar ol { list-style: none; padding: 0; margin: 0; }
    .sidebar a {
      display: block;
      padding: .58rem .55rem;
      border-radius: .4rem;
      color: #233c54;
      text-decoration: none;
    }
    .sidebar a:hover { background: #eaf0f6; }
    .sidebar a[aria-current] {
      background: #dceafa;
      color: #174775;
      font-weight: 650;
    }
    .compact-nav { display: none; }
    main {
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background: #e9eef3;
    }
    main.expanded { position: fixed; inset: 0; z-index: 1; }
    main:fullscreen { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    .controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .4rem .75rem;
      padding: .65rem .85rem;
      background: #f7f9fb;
      border-bottom: 1px solid var(--line);
    }
    .controls h2 { flex: 1 1 12rem; font-size: .98rem; }
    .tools { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; }
    #previous, #next { min-width: 2.3rem; }
    .zoom-value { min-width: 3.4rem; text-align: center; font-variant-numeric: tabular-nums; }
    .svg-link { text-decoration: none; }
    .detail-path {
      flex: 0 0 100%;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .4rem .7rem;
      font-size: .88rem;
    }
    .canvas {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      background: #e9eef3;
    }
    .canvas:focus-visible { outline-offset: -3px; }
    .canvas.dragging { cursor: grabbing; }
    .canvas img {
      position: absolute;
      left: 50%;
      top: 50%;
      pointer-events: none;
      user-select: none;
      transform-origin: center;
      background: white;
      box-shadow: 0 0 0 1px #c7d2dd;
    }
    .canvas-message {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      margin: 0;
      pointer-events: none;
    }
    [hidden] { display: none !important; }
    .inventory-scroll { overflow-x: auto; }
    .inventory-scroll table { border-collapse: collapse; width: 100%; }
    .inventory-scroll th, .inventory-scroll td { padding: .45rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .record {
      max-height: 49vh;
      overflow: auto;
      padding: .42rem .95rem;
      border-top: 1px solid var(--line);
      background: white;
      font-size: .88rem;
    }
    .record summary { cursor: pointer; color: #214d74; font-weight: 650; padding: .15rem 0; }
    .record > summary { font-size: .95rem; }
    .record-body { display: grid; grid-template-columns: 1fr 1fr; gap: .3rem 1.2rem; margin: .4rem 0; }
    .record p { margin: 0; }
    .record h3 { margin: 0 0 .15rem; font-size: .85rem; }
    .record nav { display: flex; gap: .3rem 1rem; flex-wrap: wrap; margin-top: .35rem; }
    .record details { margin: .5rem 0; }
    .record pre { overflow: auto; max-height: 20vh; background: #f2f5f8; padding: .75rem; }
    .detail-card {
      padding: .35rem .65rem;
      border: 1px solid var(--line);
      border-radius: .4rem;
      background: #f8fafc;
    }
    .detail-card[open] > summary { margin-bottom: .45rem; }
    .detail-preview {
      display: block;
      margin-top: .6rem;
      padding: .5rem;
      border: 1px solid var(--line);
      border-radius: .4rem;
      background: white;
      text-align: center;
    }
    .detail-preview img {
      display: block;
      margin: 0 auto .35rem;
      max-width: 100%;
      max-height: 190px;
      object-fit: contain;
    }
    @media (max-width: 850px) {
      body { grid-template: auto auto minmax(0, 1fr) / minmax(0, 1fr); }
      .sidebar { display: none; }
      .compact-nav {
        display: flex;
        align-items: center;
        gap: .5rem;
        padding: .4rem .6rem;
        background: #f7f9fb;
        border-bottom: 1px solid var(--line);
      }
      .compact-nav select { min-width: 0; flex: 1; }
      .controls { padding: .4rem .6rem; }
      .controls h2 { flex-basis: 100%; }
      .masthead { padding: .55rem .6rem; }
      .record-body { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <h1>ChatISEN · Architecture</h1>
    <a id="guide" href="README.md" target="_blank" rel="noopener">Guide de reconstruction</a>
  </header>

  <nav class="sidebar" aria-labelledby="c4-label">
    <h2 id="c4-label">Niveaux C4</h2>
    <ol id="views"></ol>
  </nav>
  <div class="compact-nav">
    <label for="view-picker">Niveau C4</label>
    <select id="view-picker"></select>
  </div>

  <main id="viewer" aria-label="Lecteur de diagrammes">
    <header class="controls">
      <h2 id="view-title" aria-live="polite"></h2>
      <div class="tools" aria-label="Navigation et zoom">
        <button type="button" id="previous" aria-label="Niveau précédent" title="Niveau précédent">←</button>
        <button type="button" id="next" aria-label="Niveau suivant" title="Niveau suivant">→</button>
        <button type="button" id="minus" aria-label="Réduire la vue" title="Réduire la vue">−</button>
        <output id="zoom" class="zoom-value" aria-label="Niveau de zoom">—</output>
        <button type="button" id="plus" aria-label="Agrandir la vue" title="Agrandir la vue">+</button>
        <button type="button" id="fit" title="Ajuster le diagramme à la fenêtre (F)">Ajuster</button>
        <button type="button" id="fullscreen">Plein écran</button>
        <a id="svg-link" class="svg-link" download>Télécharger le SVG</a>
      </div>
      <div class="detail-path" id="detail-path" hidden>
        <a id="back-to-level" href="#">Revenir au diagramme principal</a>
        <strong id="detail-title"></strong>
      </div>
    </header>
    <div id="canvas" class="canvas" role="region" tabindex="0" aria-label="Diagramme. Molette pour zoomer, glisser ou utiliser les flèches pour déplacer.">
      <img id="diagram" alt="" draggable="false" hidden>
      <p id="message" class="canvas-message" role="status">Chargement…</p>
      <noscript><p>Activez JavaScript ou <a href="svg/01-contexte.svg">ouvrez le diagramme de contexte</a>.</p></noscript>
    </div>
    <details class="record" id="record">
      <summary id="record-title">Détails de ce niveau</summary>
      <div id="level-notes"></div>
      <div id="level-details"></div>
    </details>
  </main>
  <template id="notes-template">
    <div class="record-body">
      <div><h3>À reproduire</h3><p class="build-note"></p></div>
      <div><h3>Contrôle attendu</h3><p class="check-note"></p></div>
    </div>
    <nav aria-label="Sources et tests"></nav>
  </template>
  <script src="lecteur.js"></script>
  <script>
    const views = architecture.views;
    const byId = (id) => document.getElementById(id);
    const viewer = byId('viewer');
    const canvas = byId('canvas');
    const diagram = byId('diagram');
    const message = byId('message');
    const picker = byId('view-picker');
    const record = byId('record');
    const previous = byId('previous');
    const next = byId('next');
    const minus = byId('minus');
    const plus = byId('plus');
    const fullscreen = byId('fullscreen');
    const padding = 14;
    const maxZoom = 12;
    let current = -1;
    let selectedDetail;
    let zoom = 1;
    let x = 0;
    let y = 0;
    let drag = null;
    const svgPath = (id) => 'svg/' + id + '.svg';
    const hosted = /^\/architecture\/(?:index\.html)?$/.test(location.pathname) && location.protocol !== 'file:';
    const sourceRoot = 'https://github.com/Zayonx-0/ChatISEN/blob/main/docs/architecture/';
    const sourceUrl = (path) => hosted ? new URL(path, sourceRoot).href : path;
    byId('guide').href = sourceUrl('README.md');
    const parents = new Map(views.flatMap((level, index) =>
      level.details.map(({id}) => [id, index])));
    const links = views.map(({id, title}, index) => {
      const label = (index + 1) + ' · ' + title;
      const item = document.createElement('li');
      const link = document.createElement('a');
      link.href = '#' + id;
      link.textContent = label;
      item.append(link);
      byId('views').append(item);
      picker.add(new Option(label, id));
      return link;
    });

    function makePanel(title) {
      const panel = document.createElement('details');
      const summary = document.createElement('summary');
      summary.textContent = title;
      panel.append(summary);
      return panel;
    }

    function makeText(text) {
      const pre = document.createElement('pre');
      pre.tabIndex = 0;
      pre.textContent = text;
      return pre;
    }

    function makeTextPanel(title, lines) {
      const panel = makePanel(title);
      panel.append(makeText(lines.join('\n')));
      return panel;
    }

    function makeSqlPanel() {
      const panel = makePanel('SQL exact des migrations');
      const label = document.createElement('label');
      label.textContent = 'Migration ';
      const select = document.createElement('select');
      const names = Object.keys(architecture.migrations);
      for (const name of names) select.add(new Option(name, name));
      const pre = makeText(architecture.migrations[names[0]]);
      select.addEventListener('change', () => {
        pre.textContent = architecture.migrations[select.value];
      });
      label.append(select);
      panel.append(label, pre);
      return panel;
    }

    function makeInventoryPanel(title) {
      const panel = makePanel(title);
      const scroll = document.createElement('div');
      scroll.className = 'inventory-scroll';
      const table = document.createElement('table');
      table.setAttribute('aria-label', title);
      const [headers, ...rows] = architecture.inventory[title];
      const heading = table.createTHead().insertRow();
      for (const text of headers) {
        const cell = document.createElement('th');
        cell.scope = 'col';
        cell.textContent = text;
        heading.append(cell);
      }
      const body = table.createTBody();
      for (const values of rows) {
        const row = body.insertRow();
        for (const value of values) row.insertCell().textContent = value;
      }
      scroll.append(table);
      panel.append(scroll);
      return panel;
    }

    function makeNotes({build, check, links, steps, stepsTitle, wire, contract, sql, tables = []}) {
      const notes = byId('notes-template').content.cloneNode(true);
      notes.querySelector('.build-note').textContent = build;
      notes.querySelector('.check-note').textContent = check;
      const sources = notes.querySelector('nav');
      for (const [label, path] of links) {
        const link = document.createElement('a');
        link.textContent = label;
        link.href = sourceUrl(path);
        link.target = '_blank';
        link.rel = 'noopener';
        sources.append(link);
      }
      for (const title of tables) notes.append(makeInventoryPanel(title));
      if (steps) notes.append(makeTextPanel(stepsTitle || 'Commandes du banc de test', steps));
      if (wire) notes.append(makeTextPanel('Exemple complet sur le réseau', wire));
      if (contract) notes.append(makeTextPanel('Opérations OpenAPI encore à raccorder', architecture.contractGaps));
      if (sql) notes.append(makeSqlPanel());
      return notes;
    }

    function makeDetail(level, detail) {
      const panel = makePanel(detail.title);
      panel.className = 'detail-card';
      panel.dataset.detail = detail.id;
      panel.setAttribute('name', 'diagrammes-du-niveau');
      const preview = document.createElement('a');
      preview.className = 'detail-preview';
      preview.href = '#' + level.id + '/' + detail.id;
      const image = document.createElement('img');
      image.alt = '';
      image.loading = 'lazy';
      image.src = svgPath(detail.id);
      preview.append(image, 'Agrandir le diagramme dans le lecteur');
      panel.append(preview, makeNotes(detail));
      return panel;
    }

    const fitScale = () => Math.min(
      Math.max(1, canvas.clientWidth - 2 * padding) / diagram.naturalWidth,
      Math.max(1, canvas.clientHeight - 2 * padding) / diagram.naturalHeight,
    );

    function paint() {
      if (diagram.hidden || !diagram.naturalWidth) return;
      const scale = fitScale() * zoom;
      const boundX = Math.max(0, (diagram.naturalWidth * scale - canvas.clientWidth) / 2 + padding);
      const boundY = Math.max(0, (diagram.naturalHeight * scale - canvas.clientHeight) / 2 + padding);
      x = Math.max(-boundX, Math.min(x, boundX));
      y = Math.max(-boundY, Math.min(y, boundY));
      diagram.style.transform = 'translate(-50%, -50%) translate(' + x + 'px, ' + y + 'px) scale(' + scale + ')';
      byId('zoom').value = Math.max(1, Math.round(scale * 100)) + ' %';
      minus.disabled = zoom <= 1;
      plus.disabled = zoom >= maxZoom;
    }

    function fit() {
      zoom = 1;
      x = 0;
      y = 0;
      paint();
    }

    function zoomBy(factor, anchorX = 0, anchorY = 0) {
      if (diagram.hidden) return;
      const value = Math.max(1, Math.min(maxZoom, zoom * factor));
      if (value === 1) {
        fit();
        return;
      }
      const ratio = value / zoom;
      x = anchorX - (anchorX - x) * ratio;
      y = anchorY - (anchorY - y) * ratio;
      zoom = value;
      paint();
    }

    function showView() {
      const [key, detailKey] = location.hash.slice(1).split('/');
      const index = views.findIndex(({id}) => id === key);
      const selected = index < 0 ? (parents.get(key) ?? 0) : index;
      const level = views[selected];
      const detail = level.details.find(({id}) => id === (index < 0 ? key : detailKey));
      const changedLevel = current !== selected;
      if (!changedLevel && selectedDetail === detail?.id) return;
      const openRecord = !changedLevel && (record.open || Boolean(selectedDetail));
      current = selected;
      selectedDetail = detail?.id;
      const title = (current + 1) + ' · ' + level.title;
      const src = svgPath(detail?.id || level.id);
      previous.disabled = selected === 0;
      next.disabled = selected === views.length - 1;
      links.forEach((link, i) => {
        if (i === selected) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      });
      picker.value = level.id;
      byId('view-title').textContent = title;
      if (changedLevel) {
        byId('level-notes').replaceChildren(makeNotes(level));
        byId('level-details').replaceChildren(...level.details.map(item => makeDetail(level, item)));
        record.scrollTop = 0;
      }
      record.open = !detail && openRecord;
      if (detail) byId('level-details').querySelector('[data-detail="' + detail.id + '"]').open = true;
      byId('record-title').textContent = 'Détails, tests et sources (' + level.details.length + ')';
      byId('detail-path').hidden = !detail;
      byId('detail-title').textContent = detail?.title || '';
      byId('back-to-level').href = '#' + level.id;
      byId('svg-link').href = src;
      document.title = (detail?.title || title) + ' · ChatISEN';
      diagram.hidden = true;
      message.hidden = false;
      message.textContent = 'Chargement…';
      byId('zoom').value = '—';
      diagram.alt = detail?.title || title;
      diagram.src = src;
    }

    function goTo(index) {
      if (views[index]) location.hash = views[index].id;
    }

    diagram.addEventListener('load', () => {
      diagram.style.width = diagram.naturalWidth + 'px';
      diagram.style.height = diagram.naturalHeight + 'px';
      diagram.hidden = false;
      message.hidden = true;
      fit();
    });
    diagram.addEventListener('error', () => {
      message.textContent = 'Impossible de charger le SVG. Vérifiez que le dossier svg accompagne cette page.';
    });
    window.addEventListener('hashchange', showView);
    new ResizeObserver(paint).observe(canvas);
    picker.addEventListener('change', () => { location.hash = picker.value; });
    previous.addEventListener('click', () => goTo(current - 1));
    next.addEventListener('click', () => goTo(current + 1));
    minus.addEventListener('click', () => zoomBy(1 / 1.25));
    plus.addEventListener('click', () => zoomBy(1.25));
    byId('fit').addEventListener('click', fit);
    function updateFullscreenButton() {
      const expanded = document.fullscreenElement === viewer || viewer.classList.contains('expanded');
      fullscreen.textContent = expanded ? 'Quitter le plein écran' : 'Plein écran';
      fullscreen.setAttribute('aria-pressed', String(expanded));
    }

    function expandViewer(expanded) {
      viewer.classList.toggle('expanded', expanded);
      updateFullscreenButton();
    }

    fullscreen.addEventListener('click', async () => {
      if (document.fullscreenElement === viewer) {
        await document.exitFullscreen();
      } else if (viewer.classList.contains('expanded')) {
        expandViewer(false);
      } else {
        if (document.fullscreenEnabled && viewer.requestFullscreen) {
          try {
            await viewer.requestFullscreen();
            return;
          } catch {
            // Local files and embedded browsers may decline native fullscreen.
          }
        }
        expandViewer(true);
      }
    });
    document.addEventListener('fullscreenchange', updateFullscreenButton);
    updateFullscreenButton();

    canvas.addEventListener('wheel', (event) => {
      event.preventDefault();
      const rect = canvas.getBoundingClientRect();
      zoomBy(event.deltaY < 0 ? 1.12 : 1 / 1.12,
        event.clientX - rect.left - rect.width / 2, event.clientY - rect.top - rect.height / 2);
    }, { passive: false });

    canvas.addEventListener('pointerdown', (event) => {
      if (event.button !== 0 || drag || zoom === 1) return;
      drag = { id: event.pointerId, clientX: event.clientX, clientY: event.clientY };
      canvas.setPointerCapture(event.pointerId);
      canvas.classList.add('dragging');
    });
    canvas.addEventListener('pointermove', (event) => {
      if (drag?.id !== event.pointerId) return;
      x += event.clientX - drag.clientX;
      y += event.clientY - drag.clientY;
      drag.clientX = event.clientX;
      drag.clientY = event.clientY;
      paint();
    });
    canvas.addEventListener('lostpointercapture', () => {
      drag = null;
      canvas.classList.remove('dragging');
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && viewer.classList.contains('expanded')) {
        expandViewer(false);
        return;
      }
      if (event.altKey || event.ctrlKey || event.metaKey || event.target.closest?.('select, pre')) return;
      if (/^[1-4]$/.test(event.key)) goTo(Number(event.key) - 1);
      else if (event.key.toLowerCase() === 'f') fit();
      else if (event.key === '+' || event.key === '=') zoomBy(1.25);
      else if (event.key === '-') zoomBy(1 / 1.25);
      else if (event.target === canvas && event.key.startsWith('Arrow')) {
        if (event.key === 'ArrowLeft') x += 55;
        if (event.key === 'ArrowRight') x -= 55;
        if (event.key === 'ArrowUp') y += 55;
        if (event.key === 'ArrowDown') y -= 55;
        paint();
      } else if (event.key === 'ArrowLeft') goTo(current - 1);
      else if (event.key === 'ArrowRight') goTo(current + 1);
      else return;
      event.preventDefault();
    });
    showView();
  </script>
</body>
</html>
